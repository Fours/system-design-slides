<!DOCTYPE html>
<!--
  ============================================================================
  SYSTEM DESIGN WALKTHROUGH — DESIGN GOOGLE DOCS
  ============================================================================

  Built from slides/example.html (see that file for how the scene builder and
  requirement-slide helpers work). This deck uses two scenes:
    - SCENE_MAIN: the full system, built up slide by slide.
    - SCENE_OT:   a zoomed-in deep dive on one collaboration session
                  (Operational Transformation), slides 6–11.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Google Docs — System Design Walkthrough</title>
  <style>
    :root {
      /* ---- Theme tokens (edit here, not inline) ---- */
      --bg: #0f172a;            /* page background */
      --panel: #1e293b;         /* diagram panel */
      --panel-2: #172033;       /* script panel */
      --ink: #e2e8f0;           /* primary text */
      --ink-dim: #94a3b8;       /* secondary text */
      --accent: #38bdf8;        /* highlights, arrows, titles, "new" glow */
      --border: #334155;        /* panel + box borders */

      /* ---- Diagram element colors (used inside the SVGs) ---- */
      --box-fill: #0b1222;
      --box-stroke: #475569;
      --box-ink: #e2e8f0;
      --line: #64748b;
      --client: #38bdf8;        /* clients / users / external actors */
      --service: #a78bfa;       /* app / services   */
      --data: #34d399;          /* data stores      */
      --infra: #facc15;         /* gateways, load balancers, CDN, DNS */
      --stream: #f472b6;        /* queues, event streaming */
      --ml: #fb923c;            /* ML / batch compute */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Deck fills the viewport; diagram on top (large), script on bottom (smaller). */
    #deck {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 12px;
    }

    /* ---- Top: diagram ---- */
    #diagram {
      flex: 1 1 62%;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    #diagram svg { width: 100%; height: 100%; }

    /* Topic badge, top-left of the diagram panel */
    #topic {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    /* ---- Bottom: script ---- */
    #script {
      flex: 0 0 25%;
      min-height: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      overflow-y: auto;
    }
    #script-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    #script-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--bg);
      background: var(--accent);
      border-radius: 999px;
      padding: 3px 11px;
      white-space: nowrap;
    }
    #script-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }
    #script-body {
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink);
    }
    #script-body p { margin: 0 0 10px; }
    #script-body strong { color: var(--ink); }
    #script-body em { color: var(--ink-dim); font-style: normal; }

    /* ---- Controls ---- */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex: 0 0 auto;
    }
    .nav {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
      font-size: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .nav:hover:not(:disabled) { background: var(--border); border-color: var(--accent); }
    .nav:disabled { opacity: 0.35; cursor: default; }
    #counter {
      font-size: 14px;
      color: var(--ink-dim);
      min-width: 70px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Reusable SVG diagram helpers ---- */
    .box rect {
      fill: var(--box-fill);
      stroke: var(--box-stroke);
      stroke-width: 1.5;
      rx: 10;
    }
    .box.client rect { stroke: var(--client); }
    .box.service rect { stroke: var(--service); }
    .box.data rect { stroke: var(--data); }
    .box.infra rect { stroke: var(--infra); }
    .box.stream rect { stroke: var(--stream); }
    .box.ml rect { stroke: var(--ml); }
    /* A layer that other edges pass through (e.g. a cache tier). Drawn behind edges. */
    .box.tier rect { fill: rgba(52, 211, 153, 0.06); stroke-dasharray: 5 5; }
    /* Something that exists but we are not drawing in detail (other regions, 3rd parties). */
    .box.ghost rect { fill: transparent; stroke-dasharray: 7 6; }
    /* Added on the current slide (set automatically by the scene builder). */
    .box.new rect { stroke-width: 3; filter: drop-shadow(0 0 7px var(--accent)); }
    .box text {
      fill: var(--box-ink);
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .box .sub {
      fill: var(--ink-dim);
      font-size: 11px;
      font-weight: 500;
    }
    .edge {
      stroke: var(--line);
      stroke-width: 1.8;
      fill: none;
      marker-end: url(#arrow);
    }
    .edge.both { marker-start: url(#arrow-start); }      /* two-way */
    .edge.plain { marker-end: none; }                    /* no arrowhead */
    .edge.async { stroke-dasharray: 6 5; }               /* async / background flow */
    .edge.new { stroke: var(--accent); marker-end: url(#arrow-new); }
    .edge.new.both { marker-start: url(#arrow-start-new); }
    .edge.new.plain { marker-end: none; }
    .edge-label {
      fill: var(--ink-dim);
      font-size: 11px;
      text-anchor: middle;
      /* Halo in the panel color keeps labels readable where they cross lines. */
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .edge-label.new { fill: var(--accent); }

    /* ---- Requirement slides (slides 1–2) ---- */
    .heading { fill: var(--accent); font-size: 24px; font-weight: 700; }
    .subheading { fill: var(--ink-dim); font-size: 14px; }
    .card rect { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
    .card .badge { fill: var(--accent); }
    .card .badge-num { fill: var(--bg); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .card .title { fill: var(--box-ink); font-size: 17px; font-weight: 700; }
    .card .line { fill: var(--ink-dim); font-size: 13.5px; }
    .panel-box { fill: var(--box-fill); stroke: var(--accent); stroke-width: 1.5; }
    .panel-title { fill: var(--accent); font-size: 17px; font-weight: 700; }
    .strip { fill: transparent; stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 7 6; }
    .strip-title { fill: var(--ink); font-size: 15px; font-weight: 700; }
    .strip-text { fill: var(--ink-dim); font-size: 13.5px; }
    .est-k { fill: var(--accent); font-size: 13.5px; font-weight: 700; }
    .est-v { fill: var(--ink); font-size: 13.5px; }
  </style>
</head>
<body>
  <div id="deck">
    <section id="diagram" aria-label="System diagram">
      <span id="topic"></span>
      <!-- SVG for the active slide is injected here -->
    </section>

    <section id="script" aria-label="Script">
      <div id="script-header">
        <span id="script-num"></span>
        <span id="script-title"></span>
      </div>
      <div id="script-body"></div>
    </section>

    <div id="controls">
      <button class="nav" id="prev" aria-label="Previous slide">&#8592;</button>
      <span id="counter"></span>
      <button class="nav" id="next" aria-label="Next slide">&#8594;</button>
    </div>
  </div>

  <script>
    // ========================================================================
    // EDIT THIS: the system being designed.
    // ========================================================================
    const TOPIC = "Design Google Docs";

    // Shared <defs>: default arrowhead, a start-reversed variant for two-way
    // edges, and accent-colored variants for edges added on the current slide.
    const DEFS = `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
        <marker id="arrow-start-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
      </defs>`;

    // Labeled box. `kind` is a space-separated class list:
    //   color: "client" | "service" | "data" | "infra" | "stream" | "ml"
    //   style: optionally plus "tier" (pass-through layer) or "ghost" (dashed)
    //   "new" is added automatically by the scene builder.
    // `sub` is an optional second line (e.g. a technology or role note).
    function box(x, y, w, h, label, kind = "", sub = "") {
      const cx = x + w / 2;
      const subText = sub
        ? `<text class="sub" x="${cx}" y="${y + h / 2 + 12}">${sub}</text>`
        : "";
      const labelY = sub ? y + h / 2 - 7 : y + h / 2;
      return `
        <g class="box ${kind}">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <text x="${cx}" y="${labelY}">${label}</text>
          ${subText}
        </g>`;
    }

    // ========================================================================
    // Requirement-slide helpers (slides 1–2). Use viewBox 0 0 1200 640.
    // ========================================================================

    // One numbered requirement card: a title plus 1–3 short lines.
    function card(x, y, w, h, num, title, lines) {
      const body = lines
        .map((l, i) => `<text class="line" x="${x + 18}" y="${y + 66 + i * 21}">${l}</text>`)
        .join("");
      return `
        <g class="card">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <circle class="badge" cx="${x + 30}" cy="${y + 30}" r="13"></circle>
          <text class="badge-num" x="${x + 30}" y="${y + 30}">${num}</text>
          <text class="title" x="${x + 52}" y="${y + 36}">${title}</text>
          ${body}
        </g>`;
    }

    // A grid of cards, numbered 1..N. items = [[title, [line, line]], ...]
    function cardGrid(x0, y0, w, h, gap, cols, items) {
      return items
        .map((it, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          return card(x0 + c * (w + gap), y0 + r * (h + gap), w, h, i + 1, it[0], it[1]);
        })
        .join("");
    }

    // Dashed strip with a title and lines (out-of-scope list, key takeaway).
    function strip(x, y, w, h, title, lines) {
      const body = lines
        .map((l, i) => `<text class="strip-text" x="${x + 24}" y="${y + 64 + i * 22}">${l}</text>`)
        .join("");
      return `
        <rect class="strip" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
        <text class="strip-title" x="${x + 24}" y="${y + 34}">${title}</text>
        ${body}`;
    }

    // Accent-bordered panel of back-of-the-envelope estimates.
    // rows = [[heading, [value, value]], ...]
    function estimatesPanel(x, y, w, h, title, rows) {
      let cy = y + 66;
      const body = rows
        .map(([k, vs]) => {
          let s = `<text class="est-k" x="${x + 20}" y="${cy}">${k}</text>`;
          vs.forEach((v) => { cy += 21; s += `<text class="est-v" x="${x + 20}" y="${cy}">${v}</text>`; });
          cy += 36;
          return s;
        })
        .join("");
      return `
        <rect class="panel-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
        <text class="panel-title" x="${x + 20}" y="${y + 32}">${title}</text>
        ${body}`;
    }

    // ========================================================================
    // Scene builder — shared by every deck. You should not need to edit this.
    //
    //   const scene = sceneBuilder(SCENE);
    //   scene({ add: ["client", "server", "e_client_server"] })  // -> <svg>
    //   scene({ add: ["db", "e_server_db"] })                    // cumulative
    //   scene({ add: [...], remove: ["server"] })                // replace a box
    //   scene()                                                  // no change
    // ========================================================================

    // Edge label position: midpoint of the longest segment. Above horizontal /
    // diagonal segments, to the right of vertical ones. Override with `lp`.
    function labelPos(e) {
      if (e.lp) return e.lp;
      let best = null, len = -1;
      for (let i = 0; i < e.pts.length - 1; i++) {
        const [x1, y1] = e.pts[i], [x2, y2] = e.pts[i + 1];
        const l = Math.hypot(x2 - x1, y2 - y1);
        if (l > len) { len = l; best = [x1, y1, x2, y2]; }
      }
      const [x1, y1, x2, y2] = best;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      return x1 === x2 ? [mx + 7, my + 4, "start"] : [mx, my - 7, "middle"];
    }

    function sceneBuilder(def) {
      const boxes = Object.fromEntries(def.boxes.map((b) => [b.id, b]));
      const visible = new Set();

      return function step({ add = [], remove = [] } = {}) {
        remove.forEach((id) => visible.delete(id));
        add.forEach((id) => visible.add(id));
        const fresh = new Set(add);
        const isOn = (id) => visible.has(id);

        const lines = [], labels = [], back = [], front = [], pts = [];

        const drawEdge = (pathPts, cls, label, lp) => {
          const d = pathPts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join(" ");
          lines.push(`<path class="edge ${cls}" d="${d}"></path>`);
          pathPts.forEach((p) => pts.push(p));
          if (label) {
            const [lx, ly, anchor] = lp;
            const nw = cls.includes("new") ? "new" : "";
            labels.push(`<text class="edge-label ${nw}" x="${lx}" y="${ly}" style="text-anchor:${anchor}">${label}</text>`);
          }
        };

        // Boxes ("tier" boxes go behind the edges, everything else in front).
        def.boxes.forEach((b) => {
          if (!isOn(b.id)) return;
          const kind = `${b.kind}${fresh.has(b.id) ? " new" : ""}`;
          const svg = box(b.x, b.y, b.w, b.h, b.label, kind, b.sub || "");
          (b.kind.includes("tier") ? back : front).push(svg);
          pts.push([b.x, b.y], [b.x + b.w, b.y + b.h]);
        });

        // Explicit edges: shown when added AND both endpoints are visible.
        def.edges.forEach((e) => {
          if (!isOn(e.id) || !isOn(e.from) || !isOn(e.to)) return;
          const cls = [
            fresh.has(e.id) ? "new" : "",
            e.both ? "both" : "",
            e.async ? "async" : "",
          ].join(" ");
          drawEdge(e.pts, cls, e.label, e.label ? labelPos(e) : null);
        });

        // Optional "bus": a hub (gateway / load balancer) fans out to member
        // boxes via a vertical line. Members join the bus as they are added.
        const bus = def.bus;
        if (bus && isOn(bus.hub)) {
          const members = bus.members.filter(isOn).map((id) => boxes[id]);
          if (members.length) {
            const hubNew = fresh.has(bus.hub);
            const ys = members.map((b) => b.y + b.h / 2).concat([bus.hubY]);
            const top = Math.min(...ys), bottom = Math.max(...ys);
            const pn = hubNew ? "new plain" : "plain";
            drawEdge([[bus.hubX, bus.hubY], [bus.x, bus.hubY]], pn, bus.label, bus.lp);
            drawEdge([[bus.x, top], [bus.x, bottom]], pn);
            members.forEach((b) => {
              const y = b.y + b.h / 2;
              drawEdge([[bus.x, y], [b.x, y]], hubNew || fresh.has(b.id) ? "new" : "");
            });
          }
        }

        // Auto-fit the viewBox to what is visible (with a minimum size).
        const pad = 40;
        let x0 = Math.min(...pts.map((p) => p[0])) - pad;
        let y0 = Math.min(...pts.map((p) => p[1])) - pad;
        let x1 = Math.max(...pts.map((p) => p[0])) + pad;
        let y1 = Math.max(...pts.map((p) => p[1])) + pad;
        const minW = 900, minH = 460;
        if (x1 - x0 < minW) { const g = (minW - (x1 - x0)) / 2; x0 -= g; x1 += g; }
        if (y1 - y0 < minH) { const g = (minH - (y1 - y0)) / 2; y0 -= g; y1 += g; }

        return `
          <svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" xmlns="http://www.w3.org/2000/svg">
            ${DEFS}
            ${back.join("")}
            ${lines.join("")}
            ${front.join("")}
            ${labels.join("")}
          </svg>`;
      };
    }

    // ========================================================================
    // SCENE_MAIN — every component of the final Google Docs system.
    //
    // Columns: clients | edge (LB, gateway, CDN) | services | data | async | external
    // ========================================================================
    const SCENE_MAIN = {
      boxes: [
        // Clients
        { id: "client",    x: 40,   y: 160, w: 170, h: 324, label: "Docs Clients", kind: "client", sub: "web · mobile · desktop" },
        { id: "local",     x: 40,   y: 510, w: 170, h: 54,  label: "Local Store", kind: "data", sub: "IndexedDB · pending ops" },
        // Edge
        { id: "lb",        x: 280,  y: 183, w: 180, h: 54,  label: "Load Balancer", kind: "infra", sub: "HTTPS API" },
        { id: "gw",        x: 280,  y: 360, w: 180, h: 124, label: "WS Gateways", kind: "infra", sub: "WebSockets · stateful" },
        { id: "cdn",       x: 280,  y: 510, w: 180, h: 54,  label: "CDN", kind: "infra", sub: "images · signed URLs" },
        // Slides 3–11 only: the naive single server (same spot as the doc service)
        { id: "server",    x: 540,  y: 160, w: 200, h: 100, label: "Docs Server", kind: "service", sub: "one process does it all" },
        // Services
        { id: "search",    x: 540,  y: 20,  w: 200, h: 54,  label: "Search Service", kind: "service", sub: "permission-aware" },
        { id: "comments",  x: 540,  y: 90,  w: 200, h: 54,  label: "Comment Service", kind: "service", sub: "threads · @mentions" },
        { id: "docapi",    x: 540,  y: 160, w: 200, h: 100, label: "Doc Service", kind: "service", sub: "stateless · open · list · share" },
        { id: "acl",       x: 540,  y: 280, w: 200, h: 54,  label: "ACL Service", kind: "service", sub: "Zanzibar-style tuples" },
        { id: "sessions",  x: 540,  y: 360, w: 200, h: 124, label: "Collab Sessions", kind: "service", sub: "OT · one owner per doc" },
        { id: "directory", x: 540,  y: 510, w: 200, h: 54,  label: "Session Directory", kind: "infra", sub: "doc → server leases" },
        // Data
        { id: "searchidx", x: 820,  y: 20,  w: 190, h: 54,  label: "Search Index", kind: "data", sub: "inverted · + ACL principals" },
        { id: "db",        x: 820,  y: 160, w: 190, h: 100, label: "Database", kind: "data", sub: "whole doc per row" },
        { id: "metadb",    x: 820,  y: 90,  w: 190, h: 244, label: "Metadata DB", kind: "data", sub: "Spanner · docs · ACLs" },
        { id: "oplog",     x: 820,  y: 360, w: 190, h: 54,  label: "Op Log", kind: "data", sub: "Bigtable · doc_id + rev" },
        { id: "blob",      x: 820,  y: 430, w: 190, h: 54,  label: "Blob Store", kind: "data", sub: "snapshots · images" },
        { id: "regions",   x: 820,  y: 510, w: 190, h: 54,  label: "Other Regions ×N", kind: "ghost", sub: "replicas · failover" },
        // Async
        { id: "indexer",   x: 1090, y: 20,  w: 200, h: 54,  label: "Search Indexer", kind: "service", sub: "debounced per doc" },
        { id: "kafka",     x: 1090, y: 160, w: 200, h: 254, label: "Change Feed", kind: "stream", sub: "Kafka · keyed by doc_id" },
        { id: "compactor", x: 1090, y: 430, w: 200, h: 54,  label: "Snapshot Worker", kind: "service", sub: "snapshots · revisions" },
        // Notifications and the outside world
        { id: "email",     x: 1360, y: 20,  w: 190, h: 54,  label: "Email · Push", kind: "ghost", sub: "third parties" },
        { id: "notif",     x: 1360, y: 160, w: 190, h: 54,  label: "Notification Workers", kind: "service", sub: "who · when · dedupe" },
      ],
      edges: [
        // Naive starting point
        { id: "e_client_server", from: "client", to: "server", pts: [[210, 190], [540, 190]], label: "HTTPS: load · save whole doc", both: true },
        { id: "e_server_db", from: "server", to: "db", pts: [[740, 210], [820, 210]], label: "SQL", both: true },
        { id: "e_client_server_ws", from: "client", to: "server", pts: [[210, 235], [540, 235]], label: "ops over WebSocket", both: true },
        // Split API from collaboration
        { id: "e_client_lb", from: "client", to: "lb", pts: [[210, 210], [280, 210]], label: "HTTPS", both: true },
        { id: "e_client_gw", from: "client", to: "gw", pts: [[210, 422], [280, 422]], label: "WebSocket", both: true },
        { id: "e_gw_sessions", from: "gw", to: "sessions", pts: [[460, 422], [540, 422]], label: "ops · cursors", both: true },
        { id: "e_docapi_db", from: "docapi", to: "db", pts: [[740, 210], [820, 210]], label: "SQL", both: true },

            <p>Now the qualities. On <strong>scale</strong> I'll assume around a billion users,

            <p>The textbook fixes don't fit a collaborative editor. <strong>Pessimistic

            <p>Each op also carries its <strong>base revision</strong>, the revision of the

            <p>The fix is <strong>transformation</strong>. The server keeps the <strong>recent

            <p>The transform rules are intuitive. If someone deleted text <em>before</em> your
            insert position, shift your insert left by that many characters. If they inserted
            before you, shift right. If two inserts land at the same position, break the tie
            deterministically, for example by user ID, so everyone picks the same order. If two

            <em>insert "big " at 6</em> is transformed against Bob's <em>delete 6 at 0</em>,

            <p>Why does this converge? With a <strong>central server</strong>, there's only one
            canonical history, and each client only ever has to reconcile with the server, never
            with other clients directly. The transform function only has to satisfy one property:
            transforming A against B and B against A leads to the same document. This is the
            <strong>Jupiter</strong> model behind Google Wave and Docs. Peer-to-peer OT also needs
            a second, much harder property that many published algorithms got wrong. The central
            server makes OT tractable.</p>
            <p>The real engineering cost is <strong>breadth</strong>. A rich-text model has many
            op types: insert, delete, format, table edits, list changes, image moves. Every pair

            <p>Once an op is transformed and has its revision number, two things happen, in a

            <p>First, it's <strong>appended to the op log</strong>, durable and replicated

            <p>Second, the <strong>broadcaster</strong> sends an <strong>ack</strong> to the

            <p>Now the client's half, which is just as important. Remember, the client applies

            <p>The protocol keeps <strong>at most one op in flight</strong>. The client sends an

            a single op: typing "hello" becomes one insert of five characters, not five ops. When
            the ack arrives, the whole buffer goes out as the next op. On a fast connection that

            <p>When a <strong>remote op</strong> arrives from the server, the client can't apply it

            direction</strong>: the remote op is transformed against the in-flight op and the
            buffer, and they in turn are transformed against the remote op. Your screen updates
            with Bob's change in the right place, and your pending ops are now expressed against
            the newer revision.</p>

            server also re-checks permissions, so if you lost edit access while offline, your

            <p>This is where it's fair to ask about <strong>CRDTs</strong>, the main alternative

            unique ID and defines ops that <strong>commute</strong>, so replicas converge in any

            heavy offline use. The costs are per-character metadata and tombstones for deleted
            text (modern CRDTs have shrunk these a lot), and rich-text semantics are harder to get
            right, especially intent-preserving formatting.</p>
            <p>For Google Docs, I'd still choose <strong>OT with a central server</strong>. OT's
            main weakness is that it needs a central sequencer, but we have one anyway for
            permissions, durability and history. OT keeps the document compact, and it's proven at

            <strong>collab session</strong>, loaded from the latest <strong>snapshot</strong> plus
            the op-log tail.</p>
            <p>She types a sentence. It appears instantly on her screen, and goes up as one composed
            op based on rev 812. Bob's concurrent edit already took rev 812 and 813, so the session
            <strong>transforms</strong> her op past it, assigns rev 814, <strong>appends</strong>
            it to the op log with a fenced conditional write, then acks Alice and pushes the op to
            Bob, whose cursor shifts to stay in place. All of that takes well under 200 ms.</p>
            <p>Downstream, the op reaches the <strong>change feed</strong>. The <strong>snapshot
            worker</strong> folds it into the next snapshot and into a history entry, "Alice,
            10:42." The <strong>search indexer</strong> re-indexes the doc once it goes quiet.
            When Alice @mentions Carol in a comment, the <strong>notification workers</strong>
            email her, unless she's already in the doc.</p>
            <p>The themes I'd underline: <strong>ops, not documents</strong>, as the unit of
            change; <strong>one sequencer per document</strong>, enforced with leases and fencing,
            giving total order where it's needed and no coordination where it isn't;
            <strong>OT</strong> for convergence, with anchors and cursors carried by the same
            transforms; <strong>the op log as the source of truth</strong>, with snapshots and
            history derived from it; and a <strong>change feed</strong> that keeps everything
            nobody is waiting on off the hot path. With more time, I'd go deeper next on the rich-text
            transform rules for tables and lists, very large documents, and the Sheets and Slides
            models, which reuse this architecture with different ops.</p>`
        }
      }
    ];


    // ========================================================================
    // Engine — shared by every deck. You should not need to edit below here.
    // ========================================================================
    let index = 0;

    const el = {
      topic: document.getElementById("topic"),
      diagram: document.getElementById("diagram"),
      num: document.getElementById("script-num"),
      title: document.getElementById("script-title"),
      body: document.getElementById("script-body"),
      prev: document.getElementById("prev"),
      next: document.getElementById("next"),
      counter: document.getElementById("counter"),
    };

    function render() {
      const slide = SLIDES[index];
      el.topic.textContent = TOPIC;

      // Replace the SVG (keep the #topic badge, which lives before it).
      const existing = el.diagram.querySelector("svg");
      if (existing) existing.remove();
      el.diagram.insertAdjacentHTML("beforeend", slide.diagram);

      el.num.textContent = `Slide ${index + 1} of ${SLIDES.length}`;
      el.title.textContent = slide.script.title;
      el.body.innerHTML = slide.script.html;

      el.counter.textContent = `${index + 1} / ${SLIDES.length}`;
      el.prev.disabled = index === 0;
      el.next.disabled = index === SLIDES.length - 1;

      el.script.scrollTop = 0;
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= SLIDES.length) return;
      index = next;
      render();
    }

    el.prev.addEventListener("click", () => go(-1));
    el.next.addEventListener("click", () => go(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    // #script is referenced in render() for scroll reset.
    el.script = document.getElementById("script");

    render();
  </script>
</body>
