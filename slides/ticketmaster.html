<!DOCTYPE html>
<!--
  ============================================================================
  SYSTEM DESIGN WALKTHROUGH — DESIGN TICKETMASTER
  ============================================================================

  Built from slides/example.html. Same layout, theme, navigation and engine.

    - Slides 1–2: functional / non-functional requirements (card grids).
    - Slides 3–11: the main scene (SCENE_MAIN) grows from one server to split
      event / booking services, seat holds with expiry, checkout and payment,
      search, caching, a CDN, and the waiting room as a single box.
    - Slides 12–16: a deep dive into the virtual waiting room (SCENE_WAIT):
      join → cached status polling → admission control → access tokens →
      bots and fairness.
    - Slides 17–20: back to the main scene: the event bus and notifications,
      the live seat map, other regions, and the complete system.

  Navigation (shared by every deck): on-screen back/forward arrows, plus the
  Left/Right arrow keys.

  The file is fully self-contained — no build step, no external dependencies.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Ticketmaster — System Design Walkthrough</title>
  <style>
    :root {
      /* ---- Theme tokens (edit here, not inline) ---- */
      --bg: #0f172a;            /* page background */
      --panel: #1e293b;         /* diagram panel */
      --panel-2: #172033;       /* script panel */
      --ink: #e2e8f0;           /* primary text */
      --ink-dim: #94a3b8;       /* secondary text */
      --accent: #38bdf8;        /* highlights, arrows, titles, "new" glow */
      --border: #334155;        /* panel + box borders */

      /* ---- Diagram element colors (used inside the SVGs) ---- */
      --box-fill: #0b1222;
      --box-stroke: #475569;
      --box-ink: #e2e8f0;
      --line: #64748b;
      --client: #38bdf8;        /* clients / users / external actors */
      --service: #a78bfa;       /* app / services   */
      --data: #34d399;          /* data stores      */
      --infra: #facc15;         /* gateways, load balancers, CDN, DNS */
      --stream: #f472b6;        /* queues, event streaming */
      --ml: #fb923c;            /* ML / batch compute */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Deck fills the viewport; diagram on top (large), script on bottom (smaller). */
    #deck {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 12px;
    }

    /* ---- Top: diagram ---- */
    #diagram {
      flex: 1 1 62%;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    #diagram svg { width: 100%; height: 100%; }

    /* Topic badge, top-left of the diagram panel */
    #topic {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    /* ---- Bottom: script ---- */
    #script {
      flex: 0 0 25%;
      min-height: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 18px 22px;
      overflow-y: auto;
    }
    #script-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    #script-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--bg);
      background: var(--accent);
      border-radius: 999px;
      padding: 3px 11px;
      white-space: nowrap;
    }
    #script-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }
    #script-body {
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink);
    }
    #script-body p { margin: 0 0 10px; }
    #script-body strong { color: var(--ink); }
    #script-body em { color: var(--ink-dim); font-style: normal; }

    /* ---- Controls ---- */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex: 0 0 auto;
    }
    .nav {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
      font-size: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .nav:hover:not(:disabled) { background: var(--border); border-color: var(--accent); }
    .nav:disabled { opacity: 0.35; cursor: default; }
    #counter {
      font-size: 14px;
      color: var(--ink-dim);
      min-width: 70px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Reusable SVG diagram helpers ---- */
    .box rect {
      fill: var(--box-fill);
      stroke: var(--box-stroke);
      stroke-width: 1.5;
      rx: 10;
    }
    .box.client rect { stroke: var(--client); }
    .box.service rect { stroke: var(--service); }
    .box.data rect { stroke: var(--data); }
    .box.infra rect { stroke: var(--infra); }
    .box.stream rect { stroke: var(--stream); }
    .box.ml rect { stroke: var(--ml); }
    /* A layer that other edges pass through (e.g. a cache tier). Drawn behind edges. */
    .box.tier rect { fill: rgba(52, 211, 153, 0.06); stroke-dasharray: 5 5; }
    /* Something that exists but we are not drawing in detail (other regions, 3rd parties). */
    .box.ghost rect { fill: transparent; stroke-dasharray: 7 6; }
    /* Added on the current slide (set automatically by the scene builder). */
    .box.new rect { stroke-width: 3; filter: drop-shadow(0 0 7px var(--accent)); }
    .box text {
      fill: var(--box-ink);
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .box .sub {
      fill: var(--ink-dim);
      font-size: 11px;
      font-weight: 500;
    }
    .edge {
      stroke: var(--line);
      stroke-width: 1.8;
      fill: none;
      marker-end: url(#arrow);
    }
    .edge.both { marker-start: url(#arrow-start); }      /* two-way */
    .edge.plain { marker-end: none; }                    /* no arrowhead */
    .edge.async { stroke-dasharray: 6 5; }               /* async / background flow */
    .edge.new { stroke: var(--accent); marker-end: url(#arrow-new); }
    .edge.new.both { marker-start: url(#arrow-start-new); }
    .edge.new.plain { marker-end: none; }
    .edge-label {
      fill: var(--ink-dim);
      font-size: 11px;
      text-anchor: middle;
      /* Halo in the panel color keeps labels readable where they cross lines. */
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .edge-label.new { fill: var(--accent); }

    /* ---- Requirement slides (slides 1–2) ---- */
    .heading { fill: var(--accent); font-size: 24px; font-weight: 700; }
    .subheading { fill: var(--ink-dim); font-size: 14px; }
    .card rect { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
    .card .badge { fill: var(--accent); }
    .card .badge-num { fill: var(--bg); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .card .title { fill: var(--box-ink); font-size: 17px; font-weight: 700; }
    .card .line { fill: var(--ink-dim); font-size: 13.5px; }
    .panel-box { fill: var(--box-fill); stroke: var(--accent); stroke-width: 1.5; }
    .panel-title { fill: var(--accent); font-size: 17px; font-weight: 700; }
    .strip { fill: transparent; stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 7 6; }
    .strip-title { fill: var(--ink); font-size: 15px; font-weight: 700; }
    .strip-text { fill: var(--ink-dim); font-size: 13.5px; }
    .est-k { fill: var(--accent); font-size: 13.5px; font-weight: 700; }
    .est-v { fill: var(--ink); font-size: 13.5px; }
  </style>
</head>
<body>
  <div id="deck">
    <section id="diagram" aria-label="System diagram">
      <span id="topic"></span>
      <!-- SVG for the active slide is injected here -->
    </section>

    <section id="script" aria-label="Script">
      <div id="script-header">
        <span id="script-num"></span>
        <span id="script-title"></span>
      </div>
      <div id="script-body"></div>
    </section>

    <div id="controls">
      <button class="nav" id="prev" aria-label="Previous slide">&#8592;</button>
      <span id="counter"></span>
      <button class="nav" id="next" aria-label="Next slide">&#8594;</button>
    </div>
  </div>

  <script>
    // ========================================================================
    // EDIT THIS: the system being designed.
    // ========================================================================
    const TOPIC = "System Design: Ticketmaster";

    // Shared <defs>: default arrowhead, a start-reversed variant for two-way
    // edges, and accent-colored variants for edges added on the current slide.
    const DEFS = `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
        <marker id="arrow-start-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
      </defs>`;

    // Labeled box. `kind` is a space-separated class list:
    //   color: "client" | "service" | "data" | "infra" | "stream" | "ml"
    //   style: optionally plus "tier" (pass-through layer) or "ghost" (dashed)
    //   "new" is added automatically by the scene builder.
    // `sub` is an optional second line (e.g. a technology or role note).
    function box(x, y, w, h, label, kind = "", sub = "") {
      const cx = x + w / 2;
      const subText = sub
        ? `<text class="sub" x="${cx}" y="${y + h / 2 + 12}">${sub}</text>`
        : "";
      const labelY = sub ? y + h / 2 - 7 : y + h / 2;
      return `
        <g class="box ${kind}">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <text x="${cx}" y="${labelY}">${label}</text>
          ${subText}
        </g>`;
    }

    // ========================================================================
    // Requirement-slide helpers (slides 1–2). Use viewBox 0 0 1200 640.
    // ========================================================================

    // One numbered requirement card: a title plus 1–3 short lines.
    function card(x, y, w, h, num, title, lines) {
      const body = lines
        .map((l, i) => `<text class="line" x="${x + 18}" y="${y + 66 + i * 21}">${l}</text>`)
        .join("");
      return `
        <g class="card">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <circle class="badge" cx="${x + 30}" cy="${y + 30}" r="13"></circle>
          <text class="badge-num" x="${x + 30}" y="${y + 30}">${num}</text>
          <text class="title" x="${x + 52}" y="${y + 36}">${title}</text>
          ${body}
        </g>`;
    }

    // A grid of cards, numbered 1..N. items = [[title, [line, line]], ...]
    function cardGrid(x0, y0, w, h, gap, cols, items) {
      return items
        .map((it, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          return card(x0 + c * (w + gap), y0 + r * (h + gap), w, h, i + 1, it[0], it[1]);
        })
        .join("");
    }

    // Dashed strip with a title and lines (out-of-scope list, key takeaway).
    function strip(x, y, w, h, title, lines) {
      const body = lines
        .map((l, i) => `<text class="strip-text" x="${x + 24}" y="${y + 64 + i * 22}">${l}</text>`)
        .join("");
      return `
        <rect class="strip" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
        <text class="strip-title" x="${x + 24}" y="${y + 34}">${title}</text>
        ${body}`;
    }

    // Accent-bordered panel of back-of-the-envelope estimates.
    // rows = [[heading, [value, value]], ...]
    function estimatesPanel(x, y, w, h, title, rows) {
      let cy = y + 66;
      const body = rows
        .map(([k, vs]) => {
          let s = `<text class="est-k" x="${x + 20}" y="${cy}">${k}</text>`;
          vs.forEach((v) => { cy += 21; s += `<text class="est-v" x="${x + 20}" y="${cy}">${v}</text>`; });
          cy += 36;
          return s;
        })
        .join("");
      return `
        <rect class="panel-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
        <text class="panel-title" x="${x + 20}" y="${y + 32}">${title}</text>
        ${body}`;
    }

    // ========================================================================
    // Scene builder — shared by every deck. You should not need to edit this.
    //
    //   const scene = sceneBuilder(SCENE);
    //   scene({ add: ["client", "server", "e_client_server"] })  // -> <svg>
    //   scene({ add: ["db", "e_server_db"] })                    // cumulative
    //   scene({ add: [...], remove: ["server"] })                // replace a box
    //   scene()                                                  // no change
    // ========================================================================

    // Edge label position: midpoint of the longest segment. Above horizontal /
    // diagonal segments, to the right of vertical ones. Override with `lp`.
    function labelPos(e) {
      if (e.lp) return e.lp;
      let best = null, len = -1;
      for (let i = 0; i < e.pts.length - 1; i++) {
        const [x1, y1] = e.pts[i], [x2, y2] = e.pts[i + 1];
        const l = Math.hypot(x2 - x1, y2 - y1);
        if (l > len) { len = l; best = [x1, y1, x2, y2]; }
      }
      const [x1, y1, x2, y2] = best;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      return x1 === x2 ? [mx + 7, my + 4, "start"] : [mx, my - 7, "middle"];
    }

    function sceneBuilder(def) {
      const boxes = Object.fromEntries(def.boxes.map((b) => [b.id, b]));
      const visible = new Set();

      return function step({ add = [], remove = [] } = {}) {
        remove.forEach((id) => visible.delete(id));
        add.forEach((id) => visible.add(id));
        const fresh = new Set(add);
        const isOn = (id) => visible.has(id);

        const lines = [], labels = [], back = [], front = [], pts = [];

        const drawEdge = (pathPts, cls, label, lp) => {
          const d = pathPts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join(" ");
          lines.push(`<path class="edge ${cls}" d="${d}"></path>`);
          pathPts.forEach((p) => pts.push(p));
          if (label) {
            const [lx, ly, anchor] = lp;
            const nw = cls.includes("new") ? "new" : "";
            labels.push(`<text class="edge-label ${nw}" x="${lx}" y="${ly}" style="text-anchor:${anchor}">${label}</text>`);
          }
        };

        // Boxes ("tier" boxes go behind the edges, everything else in front).
        def.boxes.forEach((b) => {
          if (!isOn(b.id)) return;
          const kind = `${b.kind}${fresh.has(b.id) ? " new" : ""}`;
          const svg = box(b.x, b.y, b.w, b.h, b.label, kind, b.sub || "");
          (b.kind.includes("tier") ? back : front).push(svg);
          pts.push([b.x, b.y], [b.x + b.w, b.y + b.h]);
        });

        // Explicit edges: shown when added AND both endpoints are visible.
        def.edges.forEach((e) => {
          if (!isOn(e.id) || !isOn(e.from) || !isOn(e.to)) return;
          const cls = [
            fresh.has(e.id) ? "new" : "",
            e.both ? "both" : "",
            e.async ? "async" : "",
          ].join(" ");
          drawEdge(e.pts, cls, e.label, e.label ? labelPos(e) : null);
        });

        // Optional "bus": a hub (gateway / load balancer) fans out to member
        // boxes via a vertical line. Members join the bus as they are added.
        const bus = def.bus;
        if (bus && isOn(bus.hub)) {
          const members = bus.members.filter(isOn).map((id) => boxes[id]);
          if (members.length) {
            const hubNew = fresh.has(bus.hub);
            const ys = members.map((b) => b.y + b.h / 2).concat([bus.hubY]);
            const top = Math.min(...ys), bottom = Math.max(...ys);
            const pn = hubNew ? "new plain" : "plain";
            drawEdge([[bus.hubX, bus.hubY], [bus.x, bus.hubY]], pn, bus.label, bus.lp);
            drawEdge([[bus.x, top], [bus.x, bottom]], pn);
            members.forEach((b) => {
              const y = b.y + b.h / 2;
              drawEdge([[bus.x, y], [b.x, y]], hubNew || fresh.has(b.id) ? "new" : "");
            });
          }
        }

        // Auto-fit the viewBox to what is visible (with a minimum size).
        const pad = 40;
        let x0 = Math.min(...pts.map((p) => p[0])) - pad;
        let y0 = Math.min(...pts.map((p) => p[1])) - pad;
        let x1 = Math.max(...pts.map((p) => p[0])) + pad;
        let y1 = Math.max(...pts.map((p) => p[1])) + pad;
        const minW = 900, minH = 460;
        if (x1 - x0 < minW) { const g = (minW - (x1 - x0)) / 2; x0 -= g; x1 += g; }
        if (y1 - y0 < minH) { const g = (minH - (y1 - y0)) / 2; y0 -= g; y1 += g; }

        return `
          <svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" xmlns="http://www.w3.org/2000/svg">
            ${DEFS}
            ${back.join("")}
            ${lines.join("")}
            ${front.join("")}
            ${labels.join("")}
          </svg>`;
      };
    }


    // ========================================================================
    // SCENE_MAIN — the complete Ticketmaster system.
    // Columns: clients | edge | services | cache tier | data | async | external
    // ========================================================================
    const SCENE_MAIN = {
      boxes: [
        // Clients
        { id: "client",   x: 40,  y: 195, w: 180, h: 70, label: "Fans", kind: "client", sub: "web · iOS · Android" },
        // Edge / infra
        { id: "cdn",      x: 290, y: 40,  w: 160, h: 54, label: "CDN", kind: "infra", sub: "assets · event pages" },
        { id: "gateway",  x: 290, y: 195, w: 160, h: 70, label: "API Gateway", kind: "infra", sub: "auth · limits · tokens" },
        // Services
        { id: "server",   x: 530, y: 195, w: 190, h: 70, label: "Server", kind: "service", sub: "one monolith" },
        { id: "waitroom", x: 530, y: 20,  w: 190, h: 54, label: "Waiting Room", kind: "service", sub: "queue · admission" },
        { id: "search",   x: 530, y: 90,  w: 190, h: 54, label: "Search Service", kind: "service", sub: "artist · venue · city" },
        { id: "event",    x: 530, y: 160, w: 190, h: 54, label: "Event Service", kind: "service", sub: "events · venues · layout" },
        { id: "booking",  x: 530, y: 230, w: 190, h: 54, label: "Booking Service", kind: "service", sub: "seat map · holds" },
        { id: "order",    x: 530, y: 300, w: 190, h: 54, label: "Order Service", kind: "service", sub: "checkout · confirm" },
        { id: "seatstream", x: 530, y: 510, w: 190, h: 54, label: "Seat Map Stream", kind: "service", sub: "SSE · live availability" },
        // Cache tier (edges pass through it)
        { id: "cache",    x: 770, y: 150, w: 110, h: 144, label: "Cache", kind: "data tier", sub: "Redis" },
        // Data stores
        { id: "queuestore", x: 940, y: 20, w: 190, h: 54, label: "Queue Store", kind: "data", sub: "Redis · sorted sets" },
        { id: "searchidx", x: 940, y: 90, w: 190, h: 54, label: "Search Index", kind: "data", sub: "Elasticsearch" },
        { id: "db",       x: 940, y: 160, w: 190, h: 180, label: "Primary DB", kind: "data", sub: "Postgres · sharded by event" },
        { id: "sweeper",  x: 940, y: 380, w: 190, h: 54, label: "Hold Expiry Worker", kind: "service", sub: "releases lapsed holds" },
        { id: "payment",  x: 940, y: 460, w: 190, h: 54, label: "Payment Provider", kind: "ghost", sub: "PSP · third party" },
        // Async
        { id: "notify",   x: 1210, y: 20, w: 190, h: 54, label: "Notification Svc", kind: "service", sub: "email · push · tickets" },
        { id: "kafka",    x: 1210, y: 180, w: 190, h: 74, label: "Event Bus", kind: "stream", sub: "Kafka · seat & order events" },
        // External / other regions
        { id: "email",    x: 1470, y: 20, w: 190, h: 54, label: "Email / Push", kind: "ghost", sub: "third-party delivery" },
        { id: "regions",  x: 1470, y: 283, w: 190, h: 54, label: "Other Regions ×N", kind: "ghost", sub: "browse & search replicas" },
      ],
      edges: [
        { id: "e_client_server", from: "client", to: "server", pts: [[220, 230], [530, 230]], label: "HTTPS", both: true },
        { id: "e_server_db", from: "server", to: "db", pts: [[720, 230], [940, 230]], label: "SQL" },
        { id: "e_client_gateway", from: "client", to: "gateway", pts: [[220, 230], [290, 230]], label: "HTTPS", both: true },
        { id: "e_event_db", from: "event", to: "db", pts: [[720, 187], [940, 187]], label: "events · venues" },
        { id: "e_booking_db", from: "booking", to: "db", pts: [[720, 257], [940, 257]], label: "seat map · holds", lp: [830, 274, "middle"] },
        { id: "e_sweeper_db", from: "sweeper", to: "db", pts: [[1035, 380], [1035, 340]], label: "release lapsed", lp: [1042, 365, "start"] },
        { id: "e_order_db", from: "order", to: "db", pts: [[720, 317], [940, 317]], label: "order + mark SOLD" },
        { id: "e_order_payment", from: "order", to: "payment", pts: [[720, 342], [905, 342], [905, 487], [940, 487]], label: "authorize · capture", lp: [812, 362, "middle"], both: true },

            <p>Personalized or inventory-sensitive calls (holds, orders, "my tickets") are

            sit at the edge with a one-second TTL if we need to. Ten million fans hitting it
            then turns into one origin request per edge location per second.</p>
            <p>The CDN also gives us something we'll lean on in a moment: a huge,
            globally distributed tier that is very good at <strong>serving the same bytes to
            millions of people</strong>. It handles that cheaply, and it can soak up attack
            traffic before it ever reaches us. That's exactly the shape of traffic a hot on-sale
            produces.</p>`
        }
      },
      {
        // --- Slide 11: waiting room enters the main scene ---
        diagram: main({ add: ["waitroom", "queuestore", "e_waitroom_queuestore"] }),
        script: {
          title: "The on-sale problem and the waiting room",
          html: `
            <p>So far the design handles a normal day comfortably. Now it's 9:59 a.m. and
            <strong>ten million fans</strong> are hovering over the "Buy" button for a
            50,000-seat show.</p>
            <p>Think about what happens without protection. At 10:00 everyone requests the seat
            map and tries to hold seats. Caches help with the map, but <strong>holds are
            writes</strong> on the same few thousand rows, so the conditional updates fail for
            199 out of 200 people. Those 199 immediately retry. Load on the Booking Service and
            its database shard goes vertical, latency spikes for the few who <em>could</em>
            succeed, and timeouts cause more retries. That's a <strong>thundering herd</strong>,
            and the usual outcome is that the site falls over and nobody buys anything.</p>
            <p>Scaling the database further doesn't help. The contention is on the
            <strong>same rows</strong>, so throwing hardware at it buys little, and it's
            pointless anyway: no matter how much capacity we add, only 50,000 seats exist. Most
            of those requests are <strong>destined to fail</strong>. The right move is
            to stop them before they start.</p>
            <p>That's the <strong>virtual waiting room</strong>. For an event flagged as
            high-demand, fans who arrive don't get the seat map, they get a place in
            <strong>line</strong>, kept in a <strong>Queue Store</strong>. We admit people from
            the front of the line into the purchase flow <strong>at the rate the booking
            path can actually serve</strong>, typically a few thousand a minute. Everyone else
            waits on a cheap page that tells them their position. The rest of the system
            then only ever sees a steady, bounded stream of real shoppers. Let's zoom
            into how that works.</p>`
        }
      },
      {
        // --- Slide 12: deep dive — joining the queue ---
        diagram: wait({
          add: ["fans", "edge", "wrsvc", "queue", "w_fans_edge", "w_edge_wrsvc", "w_wrsvc_queue"],
        }),
        script: {
          title: "Waiting room: joining the line",
          html: `
            <p>Zooming in. When a fan opens a high-demand event, the edge serves a static
            <strong>waiting page</strong> instead of the event, and the page calls the
            <strong>Waiting Room Service</strong> to <strong>join</strong> the queue.</p>
            <p>Joining is a single <strong>ZADD</strong> into a Redis <strong>sorted
            set</strong> for that event, keyed by a queue ticket ID with a score that sets the
            order. The service returns the fan's ticket ID and their position, signed so it
            can't be tampered with. Sorted sets give us O(log N) inserts and "what's my rank"
            lookups, and ten million entries is only a few hundred megabytes. One Redis primary
            per hot event, with a replica, handles it comfortably. If needed we can
            shard the line into buckets.</p>
            <p>The interesting choice is <strong>the score</strong>. For people who arrive
            <strong>after</strong> the on-sale starts, it's simply arrival time: first come,
            first served. But for the people who showed up early and sat in the
            <strong>pre-sale lobby</strong>, arrival order mostly measures who has the fastest
            connection or the most aggressive script. So at the start time we give everyone in
            the lobby a <strong>random</strong> position, then append later arrivals behind
            them. That's what Ticketmaster and Queue-it do, and it's both fairer and kinder to
            the system. Nobody gains anything by hammering refresh at 9:59:59.</p>
            <p>Joining happens <strong>once</strong> per fan, so even ten million joins
            spread over a few minutes is tens of thousands of writes per second. That's well
            within a Redis node. The repeated traffic, "am I there yet?", is the part we must
            keep away from this service.</p>`
        }
      },
      {
        // --- Slide 13: deep dive — cached status ---
        diagram: wait({ add: ["status", "w_edge_status"] }),
        script: {
          title: "Waiting cheaply: status from the edge",
          html: `
            <p>Ten million people waiting means ten million browsers asking <strong>"where am
            I now?"</strong>. If each asks the Waiting Room Service every few seconds, we've
            just rebuilt the thundering herd one layer earlier.</p>
            <p>The trick is to make the answer <strong>the same for everyone</strong>. Each fan
            already knows their own queue number; it's in the signed ticket they got when
            they joined. The only thing that changes is a single global value per event:
            <strong>"now serving number N"</strong>, plus an estimated admission rate. We
            publish that as a tiny <strong>Queue Status</strong> object. The page polls it
            through the <strong>CDN</strong> with a one-second cache TTL, and works out
            "you're 48,210th in line, about 14 minutes" locally.</p>
            <p>Now ten million polls per few seconds become, at the origin, <strong>one
            request per edge location per second</strong>. The CDN serves identical
            bytes to everyone, which is the job it's best at. We could push updates over
            WebSockets instead, but holding ten million open connections for a queue that
            changes once a second is far more expensive than letting the CDN answer polls. We'd
            add a little jitter to poll intervals so clients don't synchronize.</p>
            <p>This is the key insight of the whole waiting room. <strong>Waiting has to be
            almost free</strong>, because nearly everyone does it and most of them will leave
            without tickets. We only pay real cost for the small number of people at the front
            of the line.</p>`
        }
      },
      {
        // --- Slide 14: deep dive — admission control ---
        diagram: wait({
          add: ["admission", "health", "w_queue_admission", "w_admission_status", "w_health_admission"],
        }),
        script: {
          title: "Admission control: how fast to let people in",
          html: `
            <p>Something has to decide how fast "now serving" advances. That's the
            <strong>Admission Controller</strong>, and it's essentially a feedback loop.</p>
            <p>The naive version is a fixed rate, say 2,000 fans per minute. The better version
            watches <strong>capacity signals</strong> from the booking path: how many admitted
            shoppers are currently active, Booking Service and database latency, hold failure
            rates, and how many seats are left. It advances N to keep the number of
            <strong>concurrent shoppers</strong> near a target. If p99 latency on holds starts
            climbing, it slows down. When shoppers finish or time out, it lets more in. It's the
            same idea as TCP congestion control, pointed at a database shard.</p>
            <p>A useful rule of thumb for the target: with ~50,000 seats, ~4 tickets per order
            and a 10-minute hold window, the booking path never needs more than a few tens of
            thousands of concurrent shoppers. That's a number we can load-test ahead of the
            on-sale, rather than guessing what ten million people will do.</p>
            <p>Seats left also drives the <strong>endgame</strong>. As inventory runs out
            we admit fewer people. When everything is sold or held, we stop admitting and
            flip the status to <strong>"sold out, but holds may still release"</strong>. When
            it's truly gone, we tell everyone still in line <em>now</em>, instead of letting
            them wait an hour for nothing. Being honest early is a big part of making the
            experience feel fair.</p>
            <p>The controller is a single small process per event, with a standby. If it dies,
            "now serving" just stops advancing for a few seconds, which fails safe.</p>`
        }
      },
      {
        // --- Slide 15: deep dive — access tokens ---
        diagram: wait({
          add: ["gateway", "booking", "w_fans_gateway", "w_gateway_booking", "w_booking_health"],
        }),
        script: {
          title: "Access tokens: making the line enforceable",
          html: `
            <p>A queue is only real if you <strong>can't skip it</strong>. Anyone can read our
            JavaScript and call the hold API directly, so the line must be enforced
            server-side.</p>
            <p>When a fan's page sees that "now serving" has passed their number, it
            <strong>claims</strong> admission from the Waiting Room Service. The service checks
            their ticket against the current N and issues a short-lived, signed <strong>access
            token</strong>: a JWT carrying the event ID, the user ID, and an expiry of maybe 15
            minutes. Every booking call then goes through the <strong>API Gateway</strong>, which
            <strong>verifies the token's signature locally</strong>. No database lookup, no
            call back to the waiting room, so verification costs microseconds even at peak.
            Requests for a protected event without a valid token are bounced to the waiting
            page.</p>
            <p>Tokens are bound to the user and the event, so sharing one doesn't help. The
            Booking Service can also cap holds per token, which stops one admitted user from
            hoarding the whole floor. When the token expires the shopper's slot frees up, and
            that shows up in the capacity signals, so the controller admits the next person.</p>
            <p>This also gives the Booking Service a <strong>hard guarantee</strong>. Its
            traffic during an on-sale is bounded by the number of live tokens, not by the size
            of the crowd. That's what lets us keep simple, correct Postgres conditional updates
            for holds instead of reaching for something exotic. The waiting room isn't just a
            UX feature. It's what makes the core design viable.</p>`
        }
      },
      {
        // --- Slide 16: deep dive — bots and fairness ---
        diagram: wait({ add: ["bots", "w_edge_bots"] }),
        script: {
          title: "Bots, fairness and verified fans",
          html: `
            <p>The last piece of the waiting room is keeping the line <strong>human</strong>.
            Scalpers run thousands of bots to grab inventory and resell it, and every spot a bot
            takes is a real fan who leaves empty-handed.</p>
            <p>The cheapest place to stop bots is <strong>at join time</strong>, before they
            hold a spot. The edge calls a <strong>bot defense</strong> service (device
            fingerprinting, IP reputation, behavioral signals, a challenge when things look
            suspicious). I'm not designing it, but where it sits matters: in front of the
            queue, not in front of checkout, where the damage would already be done.</p>
            <p>The second layer is <strong>identity</strong>. We allow <strong>one queue spot
            per verified account</strong> (and per payment card at checkout), so a thousand
            browser tabs don't buy a thousand chances. For the biggest tours, Ticketmaster's
            "Verified Fan" goes further: fans <strong>register days in advance</strong>, get
            screened offline, and receive access codes for a specific on-sale. That turns an
            unbounded crowd into a known, pre-vetted list, so you can even size the on-sale
            before it starts.</p>
            <p>Everything else is rate limits at the gateway, per-token hold caps, and order
            limits per event. None of it is perfect; this is an arms race. But the
            architecture puts each check in the cheapest place it can go, and keeps the
            expensive inventory path reserved for people who've already passed all of them.
            That's the end of the deep dive, so let's zoom back out.</p>`
        }
      },
      {
        // --- Slide 17: back to main — event bus + notifications ---
        diagram: main({
          add: ["kafka", "notify", "email", "e_db_kafka", "e_kafka_notify", "e_notify_email"],
        }),
        script: {
          title: "An event bus for everything after the sale",
          html: `
            <p>Back to the full system. Plenty of things need to happen <strong>because</strong>
            seats were held, released or sold, and none of them should slow down checkout.
            The confirmation email, issuing the mobile ticket, updating search's sold-out flag,
            analytics, payouts to promoters. So we put an <strong>event bus</strong>,
            Kafka, behind the database.</p>
            <p>The important detail is <strong>how</strong> events get onto it. If the Order
            Service committed to Postgres and then published to Kafka, a crash between the two
            would lose the event, or publish one for a transaction that rolled back. Instead
            we use the <strong>transactional outbox</strong> pattern. The same transaction that
            marks seats SOLD also inserts an "OrderConfirmed" row into an outbox table, and a
            relay (or CDC on the outbox) publishes it to Kafka. An event exists if and only if the
            state change committed. Consumers are idempotent, since delivery is at-least-once.
            Topics are <strong>partitioned by event ID</strong>, so all changes for one show stay
            in order.</p>
            <p>The first consumer is the <strong>Notification Service</strong>. On
            OrderConfirmed it generates the tickets and sends the confirmation through
            third-party email and push providers. Mobile tickets use a <strong>rotating
            QR code</strong>: the barcode is derived from a secret plus the current time, so a
            screenshot stops working after a few seconds, which kills a lot of ticket fraud.
            The same service sends the "it's your turn" push for fans who left the waiting
            page.</p>
            <p>Because this all hangs off the bus, a slow email provider never delays a
            purchase. It just builds a backlog that drains when the provider recovers.</p>`
        }
      },
      {
        // --- Slide 18: live seat map ---
        diagram: main({ add: ["seatstream", "e_kafka_seatstream"] }),
        script: {
          title: "A live seat map with server-sent events",
          html: `
            <p>Admitted shoppers are staring at the seat map deciding what to buy, and nothing
            is more frustrating than clicking seat after seat that's already gone. A one-or-two
            second snapshot is OK, but we can do better for the people who are actually
            shopping.</p>
            <p>The <strong>Seat Map Stream</strong> service consumes <strong>SeatsHeld,
            SeatsReleased and SeatsSold</strong> events from Kafka and pushes them to clients
            over <strong>server-sent events</strong>. A client loads the snapshot, opens a
            stream for that event, and applies the deltas as they arrive. Seats grey out within
            a fraction of a second of someone else grabbing them. When the expiry worker frees
            a lapsed hold, those seats light back up. Each delta carries a sequence number, so a
            client that misses some just re-fetches the snapshot.</p>
            <p>I chose <strong>SSE over WebSockets</strong> because the traffic is one-way,
            server to client. SSE is plain HTTP, it works through proxies and the CDN, and
            browsers reconnect automatically. Polling would also work, but at a one-second
            interval it's a lot of wasted requests, and it's still less fresh.</p>
            <p>Here the waiting room pays off again. Live streams only go to the
            <strong>admitted</strong> shoppers, maybe tens of thousands per hot event, not ten
            million. That's a few stream servers, each fanning one Kafka partition out to many
            connections. Fans still in line, or browsing low-demand events, keep using the cached
            snapshot. Push is something we give to the people for whom freshness actually
            changes the outcome.</p>`
        }
      },
      {
        // --- Slide 19: other regions + partitioning ---
        diagram: main({ add: ["regions", "e_db_regions"] }),
        script: {
          title: "Partitioning inventory and going multi-region",
          html: `
            <p>Two scaling questions remain: how the inventory database grows, and what happens
            across regions.</p>
            <p>The inventory <strong>shards by event ID</strong>. Every query on the hot path
            ("availability for event X", "hold these seats at event X", "sell this hold") is
            scoped to a single event, so every transaction stays on <strong>one
            shard</strong>, with no distributed transactions. An event's seats, holds and the orders
            that touch them all live together. The catch is <strong>hot
            partitions</strong>: one event can be a million times hotter than its neighbours. So
            we know the big on-sales in advance and <strong>place them deliberately</strong>,
            moving a mega-event onto a dedicated shard before its on-sale, with replicas for the
            read side. Because the waiting room bounds the write rate, a single well-provisioned
            Postgres primary per hot event is plenty.</p>
            <p>For regions, I'd split along the same consistency line as before. The
            <strong>catalog</strong> (events, venues, search) is replicated
            asynchronously to <strong>every region</strong>, so browsing is local and fast
            everywhere. Each event's <strong>inventory has a single home region</strong>, normally
            the one closest to the venue, and every hold and sale for it is written there. That
            costs an extra hundred milliseconds or so for a fan buying a ticket on another
            continent. In exchange, we never have to reconcile two regions that both sold seat
            14C. For a ticketing system that's an easy trade.</p>
            <p>If a home region fails, its events' inventory fails over to a standby replica in
            another region, with a brief pause in sales for those events. We'd rather pause
            than risk double-selling.</p>`
        }
      },
      {
        // --- Slide 20: the complete system ---
        diagram: main(),
        script: {
          title: "The complete system",
          html: `
            <p>Here's the whole design. Let's walk one hot on-sale through it end to end.</p>
            <p>Fans load the event through the <strong>CDN</strong>, which serves the page, the
            venue map, and for a high-demand show, the <strong>waiting page</strong>. They
            <strong>join the queue</strong> once, through the Waiting Room into a Redis
            <strong>sorted set</strong>, with randomized order for early arrivals. Then
            they wait, cheaply, polling a <strong>cached "now serving" number</strong> at the
            edge. An admission controller advances that number as fast as the booking path can
            handle, and each admitted fan claims a <strong>signed access token</strong> that the
            gateway checks on every booking call.</p>
            <p>Inside, the <strong>Booking Service</strong> serves the seat map from a cached
            snapshot, with <strong>live deltas over SSE</strong>. It places
            <strong>holds</strong> with a single conditional update on the event's
            <strong>Postgres shard</strong>, where holds expire lazily and a sweeper releases
            lapsed ones. The <strong>Order Service</strong> authorizes payment, flips held seats
            to SOLD only if the hold is still theirs, captures, and writes an
            <strong>outbox</strong> event, all idempotently. <strong>Kafka</strong> carries those
            events to notifications, ticket issuance, the live seat map and analytics. Browsing
            and search run on caches, a CDN and an Elasticsearch index fed by CDC, replicated
            to every region, while each event's inventory lives in exactly one home region.</p>
            <p>The two big ideas: first, <strong>protect a tiny, contended inventory with a
            strongly consistent store and conditional writes</strong>. Use one source of truth,
            make the cache a hint and the database the decision. Second, <strong>shape the crowd
            before it reaches that store</strong>. Make waiting almost free, admit people at the
            rate we can serve, and enforce it with tokens. If I had more time I'd go deeper on
            general-admission inventory, the resale marketplace, and load-testing an on-sale
            before it happens. But this is the system I'd ship.</p>`
        }
      }
    ];

    // ========================================================================
    // Engine — shared by every deck. You should not need to edit below here.
    // ========================================================================
    let index = 0;

    const el = {
      topic: document.getElementById("topic"),
      diagram: document.getElementById("diagram"),
      num: document.getElementById("script-num"),
      title: document.getElementById("script-title"),
      body: document.getElementById("script-body"),
      prev: document.getElementById("prev"),
      next: document.getElementById("next"),
      counter: document.getElementById("counter"),
    };

    function render() {
      const slide = SLIDES[index];
      el.topic.textContent = TOPIC;

      // Replace the SVG (keep the #topic badge, which lives before it).
      const existing = el.diagram.querySelector("svg");
      if (existing) existing.remove();
      el.diagram.insertAdjacentHTML("beforeend", slide.diagram);

      el.num.textContent = `Slide ${index + 1} of ${SLIDES.length}`;
      el.title.textContent = slide.script.title;
      el.body.innerHTML = slide.script.html;

      el.counter.textContent = `${index + 1} / ${SLIDES.length}`;
      el.prev.disabled = index === 0;
      el.next.disabled = index === SLIDES.length - 1;

      el.script.scrollTop = 0;
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= SLIDES.length) return;
      index = next;
      render();
    }

    el.prev.addEventListener("click", () => go(-1));
    el.next.addEventListener("click", () => go(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    // #script is referenced in render() for scroll reset.
    el.script = document.getElementById("script");

    render();
  </script>
