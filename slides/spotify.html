<!DOCTYPE html>
<!--
  ============================================================================
  SYSTEM DESIGN WALKTHROUGH — DESIGN SPOTIFY
  ============================================================================

  Built from slides/example.html. Same layout, theme, navigation and engine.

  Differences from the bare template:
    - Slides 1–2 are requirement slides (functional / non-functional). Their
      "diagram" is a grid of requirement cards rather than a system sketch.
    - The architecture diagrams are generated by a small "scene builder":
      every component and edge is declared ONCE with its final position, and
      each slide only says which elements it adds (or removes). Elements added
      on the current slide are highlighted with an accent glow, and the
      viewBox auto-fits whatever is visible, so early slides are not tiny.
    - Two scenes: SCENE_MAIN (the overall architecture) and SCENE_RECS (a
      zoomed-in deep dive on the recommendation pipeline, slides 17–24).

  Navigation (shared by every deck): on-screen back/forward arrows, plus the
  Left/Right arrow keys.

  The file is fully self-contained — no build step, no external dependencies.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Spotify — System Design Walkthrough</title>
  <style>
    :root {
      /* ---- Theme tokens (edit here, not inline) ---- */
      --bg: #0f172a;            /* page background */
      --panel: #1e293b;         /* diagram panel */
      --panel-2: #172033;       /* script panel */
      --ink: #e2e8f0;           /* primary text */
      --ink-dim: #94a3b8;       /* secondary text */
      --accent: #38bdf8;        /* highlights, arrows, titles */
      --border: #334155;        /* panel + box borders */

      /* ---- Diagram element colors (used inside the SVGs) ---- */
      --box-fill: #0b1222;
      --box-stroke: #475569;
      --box-ink: #e2e8f0;
      --line: #64748b;
      --client: #38bdf8;        /* clients / users  */
      --service: #a78bfa;       /* app / services   */
      --data: #34d399;          /* data stores      */
      --infra: #facc15;         /* gateways, CDN, DNS */
      --stream: #f472b6;        /* event streaming  */
      --ml: #fb923c;            /* ML / batch compute */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Deck fills the viewport; diagram on top (large), script on bottom (smaller). */
    #deck {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 12px;
    }

    /* ---- Top: diagram ---- */
    #diagram {
      flex: 1 1 62%;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    #diagram svg { width: 100%; height: 100%; }

    /* Topic badge, top-left of the diagram panel */
    #topic {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    /* ---- Bottom: script ---- */
    #script {
      flex: 0 0 34%;
      min-height: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      overflow-y: auto;
    }
    #script-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    #script-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--bg);
      background: var(--accent);
      border-radius: 999px;
      padding: 3px 11px;
      white-space: nowrap;
    }
    #script-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }
    #script-body {
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink);
    }
    #script-body p { margin: 0 0 10px; }
    #script-body strong { color: var(--ink); }
    #script-body em { color: var(--ink-dim); font-style: normal; }

    /* ---- Controls ---- */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex: 0 0 auto;
    }
    .nav {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
      font-size: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .nav:hover:not(:disabled) { background: var(--border); border-color: var(--accent); }
    .nav:disabled { opacity: 0.35; cursor: default; }
    #counter {
      font-size: 14px;
      color: var(--ink-dim);
      min-width: 70px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Reusable SVG diagram helpers ---- */
    .box rect {
      fill: var(--box-fill);
      stroke: var(--box-stroke);
      stroke-width: 1.5;
      rx: 10;
    }
    .box.client rect { stroke: var(--client); }
    .box.service rect { stroke: var(--service); }
    .box.data rect { stroke: var(--data); }
    .box.infra rect { stroke: var(--infra); }
    .box.stream rect { stroke: var(--stream); }
    .box.ml rect { stroke: var(--ml); }
    /* A layer that other edges pass through (e.g. the cache tier). */
    .box.tier rect { fill: rgba(52, 211, 153, 0.06); stroke-dasharray: 5 5; }
    /* Something that exists but we are not drawing in detail. */
    .box.ghost rect { fill: transparent; stroke-dasharray: 7 6; }
    /* Added on the current slide. */
    .box.new rect { stroke-width: 3; filter: drop-shadow(0 0 7px var(--accent)); }
    .box text {
      fill: var(--box-ink);
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .box .sub {
      fill: var(--ink-dim);
      font-size: 11px;
      font-weight: 500;
    }
    .edge {
      stroke: var(--line);
      stroke-width: 1.8;
      fill: none;
      marker-end: url(#arrow);
    }
    .edge.both { marker-start: url(#arrow-start); }
    .edge.plain { marker-end: none; }
    .edge.async { stroke-dasharray: 6 5; }
    .edge.new { stroke: var(--accent); marker-end: url(#arrow-new); }
    .edge.new.both { marker-start: url(#arrow-start-new); }
    .edge.new.plain { marker-end: none; }
    .edge-label {
      fill: var(--ink-dim);
      font-size: 11px;
      text-anchor: middle;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .edge-label.new { fill: var(--accent); }

    /* ---- Requirement cards (slides 1–2) ---- */
    .heading { fill: var(--accent); font-size: 24px; font-weight: 700; }
    .subheading { fill: var(--ink-dim); font-size: 14px; }
    .card rect { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
    .card .badge { fill: var(--accent); }
    .card .badge-num { fill: var(--bg); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .card .title { fill: var(--box-ink); font-size: 17px; font-weight: 700; }
    .card .line { fill: var(--ink-dim); font-size: 13.5px; }
    .panel-box { fill: var(--box-fill); stroke: var(--accent); stroke-width: 1.5; }
    .strip { fill: transparent; stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 7 6; }
    .strip-title { fill: var(--ink); font-size: 15px; font-weight: 700; }
    .strip-text { fill: var(--ink-dim); font-size: 13.5px; }
    .est-k { fill: var(--accent); font-size: 13.5px; font-weight: 700; }
    .est-v { fill: var(--ink); font-size: 13.5px; }
  </style>
</head>
<body>
  <div id="deck">
    <section id="diagram" aria-label="System diagram">
      <span id="topic"></span>
      <!-- SVG for the active slide is injected here -->
    </section>

    <section id="script" aria-label="Script">
      <div id="script-header">
        <span id="script-num"></span>
        <span id="script-title"></span>
      </div>
      <div id="script-body"></div>
    </section>

    <div id="controls">
      <button class="nav" id="prev" aria-label="Previous slide">&#8592;</button>
      <span id="counter"></span>
      <button class="nav" id="next" aria-label="Next slide">&#8594;</button>
    </div>
  </div>

  <script>
    const TOPIC = "Design Spotify";

    // Shared <defs>: default arrowhead, a start-reversed variant for two-way
    // edges, and accent-colored variants for edges added on the current slide.
    const DEFS = `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
        <marker id="arrow-start-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
      </defs>`;

    // Labeled box (same helper as the template). `kind` is a space-separated
    // class list: "client" | "service" | "data" | "infra" | "stream" | "ml",
    // optionally plus "tier", "ghost" or "new".
    function box(x, y, w, h, label, kind = "", sub = "") {
      const cx = x + w / 2;
      const subText = sub
        ? `<text class="sub" x="${cx}" y="${y + h / 2 + 12}">${sub}</text>`
        : "";
      const labelY = sub ? y + h / 2 - 7 : y + h / 2;
      return `
        <g class="box ${kind}">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <text x="${cx}" y="${labelY}">${label}</text>
          ${subText}
        </g>`;
    }

    // ========================================================================
    // Requirement-slide helpers (slides 1–2)
    // ========================================================================
    function card(x, y, w, h, num, title, lines) {
      const body = lines
        .map((l, i) => `<text class="line" x="${x + 18}" y="${y + 66 + i * 21}">${l}</text>`)
        .join("");
      return `
        <g class="card">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <circle class="badge" cx="${x + 30}" cy="${y + 30}" r="13"></circle>
          <text class="badge-num" x="${x + 30}" y="${y + 30}">${num}</text>
          <text class="title" x="${x + 52}" y="${y + 36}">${title}</text>
          ${body}
        </g>`;
    }

    function cardGrid(x0, y0, w, h, gap, cols, items) {
      return items
        .map((it, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          return card(x0 + c * (w + gap), y0 + r * (h + gap), w, h, i + 1, it[0], it[1]);
        })
        .join("");
    }

    // ========================================================================
    // Scene builder: declare every box / edge once (final positions), then
    // each slide calls step({ add, remove }). Visibility is cumulative.
    // ========================================================================
    function labelPos(e) {
      if (e.lp) return e.lp;
      let best = null, len = -1;
      for (let i = 0; i < e.pts.length - 1; i++) {
        const [x1, y1] = e.pts[i], [x2, y2] = e.pts[i + 1];
        const l = Math.hypot(x2 - x1, y2 - y1);
        if (l > len) { len = l; best = [x1, y1, x2, y2]; }
      }
      const [x1, y1, x2, y2] = best;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      return x1 === x2 ? [mx + 7, my + 4, "start"] : [mx, my - 7, "middle"];
    }

    function sceneBuilder(def) {
      const boxes = Object.fromEntries(def.boxes.map((b) => [b.id, b]));
      const visible = new Set();

      return function step({ add = [], remove = [] } = {}) {
        remove.forEach((id) => visible.delete(id));
        add.forEach((id) => visible.add(id));
        const fresh = new Set(add);
        const isOn = (id) => visible.has(id);

        const lines = [], labels = [], back = [], front = [], pts = [];

        const drawEdge = (pathPts, cls, label, lp) => {
          const d = pathPts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join(" ");
          lines.push(`<path class="edge ${cls}" d="${d}"></path>`);
          pathPts.forEach((p) => pts.push(p));
          if (label) {
            const [lx, ly, anchor] = lp;
            const nw = cls.includes("new") ? "new" : "";
            labels.push(`<text class="edge-label ${nw}" x="${lx}" y="${ly}" style="text-anchor:${anchor}">${label}</text>`);
          }
        };

        // Boxes
        def.boxes.forEach((b) => {
          if (!isOn(b.id)) return;
          const kind = `${b.kind}${fresh.has(b.id) ? " new" : ""}`;
          const svg = box(b.x, b.y, b.w, b.h, b.label, kind, b.sub || "");
          (b.kind.includes("tier") ? back : front).push(svg);
          pts.push([b.x, b.y], [b.x + b.w, b.y + b.h]);
        });

        // Explicit edges: shown when listed AND both endpoints are visible.
        def.edges.forEach((e) => {
          if (!isOn(e.id) || !isOn(e.from) || !isOn(e.to)) return;
          const cls = [
            fresh.has(e.id) ? "new" : "",
            e.both ? "both" : "",
            e.async ? "async" : "",
          ].join(" ");
          drawEdge(e.pts, cls, e.label, e.label ? labelPos(e) : null);
        });

        // Optional "bus": hub fans out to member services via a vertical line.
        const bus = def.bus;
        if (bus && isOn(bus.hub)) {
          const members = bus.members.filter(isOn).map((id) => boxes[id]);
          if (members.length) {
            const hubNew = fresh.has(bus.hub);
            const ys = members.map((b) => b.y + b.h / 2).concat([bus.hubY]);
            const top = Math.min(...ys), bottom = Math.max(...ys);
            const pn = hubNew ? "new plain" : "plain";
            drawEdge([[bus.hubX, bus.hubY], [bus.x, bus.hubY]], pn, bus.label, bus.lp);
            drawEdge([[bus.x, top], [bus.x, bottom]], pn);
            members.forEach((b) => {
              const y = b.y + b.h / 2;
              drawEdge([[bus.x, y], [b.x, y]], hubNew || fresh.has(b.id) ? "new" : "");
            });
          }
        }

        // Auto-fit the viewBox to what is visible (with a minimum size).
        const pad = 40;
        let x0 = Math.min(...pts.map((p) => p[0])) - pad;
        let y0 = Math.min(...pts.map((p) => p[1])) - pad;
        let x1 = Math.max(...pts.map((p) => p[0])) + pad;
        let y1 = Math.max(...pts.map((p) => p[1])) + pad;
        const minW = 900, minH = 460;
        if (x1 - x0 < minW) { const g = (minW - (x1 - x0)) / 2; x0 -= g; x1 += g; }
        if (y1 - y0 < minH) { const g = (minH - (y1 - y0)) / 2; y0 -= g; y1 += g; }

        return `
          <svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" xmlns="http://www.w3.org/2000/svg">
            ${DEFS}
            ${back.join("")}
            ${lines.join("")}
            ${front.join("")}
            ${labels.join("")}
          </svg>`;
      };
    }

    // ========================================================================
    // SCENE_MAIN — the overall architecture.
    // Columns: clients | edge (gateway, CDN) | services | cache | data | async
    // ========================================================================
    const SCENE_MAIN = {
      boxes: [
        // Clients
        { id: "offline",  x: 40,  y: 130, w: 180, h: 54, label: "Offline Storage", kind: "client", sub: "encrypted downloads" },
        { id: "client",   x: 40,  y: 230, w: 180, h: 70, label: "Client Apps", kind: "client", sub: "mobile · desktop · web" },
        { id: "player",   x: 40,  y: 320, w: 180, h: 60, label: "Audio Player", kind: "client", sub: "ABR · buffer · decrypt" },
        { id: "label",    x: 40,  y: 640, w: 180, h: 54, label: "Labels / Artists", kind: "client", sub: "content providers" },
        // Edge / infra
        { id: "dns",      x: 290, y: 130, w: 160, h: 54, label: "GeoDNS", kind: "infra", sub: "nearest healthy region" },
        { id: "gateway",  x: 290, y: 230, w: 160, h: 70, label: "API Gateway", kind: "infra", sub: "auth · routing · limits" },
        { id: "realtime", x: 290, y: 520, w: 160, h: 54, label: "Realtime Gateway", kind: "infra", sub: "WebSockets" },
        { id: "cdn",      x: 290, y: 600, w: 160, h: 54, label: "CDN", kind: "infra", sub: "edge-cached audio" },
        // Services
        { id: "server",   x: 530, y: 230, w: 190, h: 70, label: "App Server", kind: "service", sub: "metadata + MP3s on disk" },
        { id: "auth",     x: 530, y: 20,  w: 190, h: 54, label: "User / Auth", kind: "service", sub: "accounts · tier · country" },
        { id: "catalog",  x: 530, y: 90,  w: 190, h: 54, label: "Catalog Service", kind: "service", sub: "tracks · albums · artists" },
        { id: "playback", x: 530, y: 160, w: 190, h: 54, label: "Playback Service", kind: "service", sub: "rights · license · URLs" },
        { id: "search",   x: 530, y: 230, w: 190, h: 54, label: "Search Service", kind: "service", sub: "query → ranked results" },
        { id: "playlist", x: 530, y: 300, w: 190, h: 54, label: "Playlist & Library", kind: "service", sub: "playlists · saved items" },
        { id: "recs",     x: 530, y: 370, w: 190, h: 54, label: "Recommendation Svc", kind: "service", sub: "home · mixes · radio" },
        { id: "collector",x: 530, y: 440, w: 190, h: 54, label: "Event Collector", kind: "stream", sub: "client telemetry" },
        { id: "connect",  x: 530, y: 520, w: 190, h: 54, label: "Connect Service", kind: "service", sub: "cross-device control" },
        { id: "ingest",   x: 530, y: 640, w: 190, h: 54, label: "Ingestion Service", kind: "service", sub: "validate · dedupe · store" },
        // Cache tier (edges pass through it)
        { id: "cache",    x: 770, y: 8,   w: 120, h: 428, label: "Cache Tier", kind: "data tier", sub: "Redis / Memcached" },
        // Data stores
        { id: "userdb",   x: 940, y: 20,  w: 180, h: 54, label: "User DB", kind: "data", sub: "profiles · subscriptions" },
        { id: "catalogdb",x: 940, y: 90,  w: 180, h: 54, label: "Catalog DB", kind: "data", sub: "Postgres · read replicas" },
        { id: "rights",   x: 940, y: 160, w: 180, h: 54, label: "Rights & Keys", kind: "data", sub: "licenses · DRM keys" },
        { id: "searchidx",x: 940, y: 230, w: 180, h: 54, label: "Search Index", kind: "data", sub: "Elasticsearch" },
        { id: "playlistdb",x: 940, y: 300, w: 180, h: 54, label: "Playlist DB", kind: "data", sub: "Cassandra" },
        { id: "recsstore",x: 940, y: 370, w: 180, h: 54, label: "Recs Store", kind: "data", sub: "precomputed, key-value" },
        { id: "session",  x: 940, y: 520, w: 180, h: 54, label: "Session Store", kind: "data", sub: "Redis · player state" },
        { id: "blob",     x: 940, y: 640, w: 180, h: 54, label: "Audio Blob Store", kind: "data", sub: "masters + encodings" },
        // Async / data platform
        { id: "regions",  x: 1260, y: 10, w: 360, h: 90, label: "Other Regions ×N", kind: "ghost", sub: "same stack · active-active" },
        { id: "recspipe", x: 1200, y: 300, w: 180, h: 70, label: "Recs ML Pipeline", kind: "ml", sub: "features · training · batch" },
        { id: "kafka",    x: 1200, y: 430, w: 180, h: 74, label: "Event Bus", kind: "stream", sub: "Kafka" },
        { id: "transcoders", x: 1200, y: 640, w: 180, h: 54, label: "Transcoders", kind: "service", sub: "autoscaled workers" },
        { id: "royalties",x: 1440, y: 160, w: 180, h: 54, label: "Royalty Reporting", kind: "service", sub: "labels · analytics" },
        { id: "datalake", x: 1440, y: 300, w: 180, h: 70, label: "Data Lake", kind: "data", sub: "GCS · BigQuery" },
        { id: "streamproc", x: 1440, y: 430, w: 180, h: 74, label: "Stream Processing", kind: "stream", sub: "dedupe · count · fraud" },
      ],
      edges: [
        { id: "e_client_server", from: "client", to: "server", pts: [[220, 265], [530, 265]], label: "HTTP: list tracks, GET file", both: true },
        { id: "e_server_catalogdb", from: "server", to: "catalogdb", pts: [[720, 250], [940, 117]], label: "metadata" },
        { id: "e_blob_client", from: "blob", to: "client", pts: [[940, 667], [220, 300]], label: "audio bytes (signed URL)" },
        { id: "e_cdn_client", from: "cdn", to: "client", pts: [[290, 627], [100, 627], [100, 300]], label: "audio", lp: [195, 620, "middle"] },
        { id: "e_cdn_player", from: "cdn", to: "player", pts: [[290, 627], [100, 627], [100, 380]], label: "audio segments", lp: [195, 620, "middle"] },
        { id: "e_cdn_blob", from: "cdn", to: "blob", pts: [[450, 607], [1030, 607], [1030, 640]], label: "origin pull on cache miss" },
        { id: "e_client_gateway", from: "client", to: "gateway", pts: [[220, 275], [290, 275]], label: "HTTPS", both: true },
        { id: "e_auth_userdb", from: "auth", to: "userdb", pts: [[720, 47], [940, 47]] },
        { id: "e_catalog_catalogdb", from: "catalog", to: "catalogdb", pts: [[720, 117], [940, 117]] },
        { id: "e_playback_catalog", from: "playback", to: "catalog", pts: [[625, 160], [625, 144]] },
        { id: "e_playback_rights", from: "playback", to: "rights", pts: [[720, 187], [940, 187]] },

            million tracks, and tens of millions of concurrent streams at peak.</p>
            <p>On <strong>latency</strong>, the target that matters most is time to first audio:
            under about 200 milliseconds for popular tracks and under a second in general.
            Search should feel instant, under 100 milliseconds. On
            <strong>availability</strong>, I want four nines for <em>playback specifically</em>.

            <p>The first split is between <strong>metadata</strong> and <strong>audio

            <p>Metadata covers artists, albums, tracks, credits, release dates, which countries a

            <em>track_id/encoding</em>, or better, by a content hash.</p>
            <p>The server no longer streams bytes itself. When a user hits play, it looks up the
            track in the catalog and returns a <strong>short-lived signed URL</strong>, and the
            client downloads directly from the blob store. That takes our app server out of the
            bandwidth path entirely.</p>
            <p>The fact that audio is immutable is the most important property in this design.

            <p>Serving 1.6 Tbps straight from a blob store in one region is slow for distant

            <p>Because files are immutable and content-addressed, there's <strong>no cache

            <p>A few trade-offs are worth mentioning. At this scale you'd typically use
            <strong>multiple CDN vendors</strong> for cost negotiation and failover, and possibly

            alternative, early Spotify actually used <strong>peer-to-peer</strong> delivery

            surprisingly large share of plays because people replay the same songs constantly.

          title: "Recs deep dive ④: candidate generation",
          html: `
            <p>We now have good vectors for users and tracks. We still can't score 100 million
            tracks per user, so recommendation is a <strong>two-stage funnel</strong>. First,
            <strong>candidate generation</strong> cheaply narrows millions of tracks down to a few
            thousand plausible ones. Second, <strong>ranking</strong> scores those few thousand
            carefully. This is the standard architecture for large-scale recommenders, and the
            split is fundamentally about where to spend compute.</p>
            <p>The main retrieval tool is an <strong>approximate nearest neighbor (ANN)
            index</strong> over the track embeddings. Given a query vector, such as a user's taste
            vector or a seed track for radio, it returns the top few hundred closest tracks in a few
            milliseconds. Exact search over 100 million vectors would be far too slow, so we
            accept slightly approximate results using graph-based methods like
            <strong>HNSW</strong>. Spotify actually open-sourced two libraries for exactly this,
            Annoy and later Voyager.</p>
            <p>But we never rely on one source. <strong>Other candidate sources</strong> include the
            <strong>artist graph</strong> (related artists of ones you love), <strong>new
            releases</strong> from artists you follow, your <strong>recent heavy rotation</strong>,
            <strong>editorial pools</strong> curated by humans, and what's <strong>trending in your
            region</strong>. Each source is tuned for <strong>recall, not precision</strong>. Its job
            is to make sure good options make it into the pool, and the ranker decides which are
            best. Multiple sources also protect against any single model's blind spots.</p>
            <p>The candidate generator unions and deduplicates these, and applies cheap
            <strong>hard filters</strong> early. Remove tracks unavailable in the user's country,
            and for something like Discover Weekly, remove anything the user has already
            heard, since the whole point is discovery.</p>`
        }

      {
        // --- Slide 21: recs — ranking + business rules ---
        diagram: recs({ add: ["ranker", "filters", "b_feat_ranker", "b_cand_ranker", "b_ranker_filters"] }),
        script: {
          title: "Recs deep dive ⑤: ranking and business rules",
          html: `
            <p>Now we score the few thousand candidates with a much richer <strong>ranking
            model</strong>, typically gradient-boosted trees or a deep neural network. Since we
            only run it on thousands of items rather than millions, it can afford hundreds of
            features pulled from the <strong>feature store</strong>. Those include user features,
            track features, <strong>user-track cross features</strong> such as embedding similarity
            and how much the user plays this artist, and <strong>context</strong>: time of day,
            device, and what they've been doing this session.</p>
            <p>What does the model predict? This is a product decision as much as an ML one. A
            single "will they click" target produces clickbait-ish results. Instead we use a
            <strong>multi-task objective</strong>: the probability they'll stream it past 30
            seconds, the probability they'll save it, and the probability they'll skip it. These
            are combined into one utility score, with weights the product team can tune. The
            labels come from the logged outcomes of past recommendations.</p>
            <p>The ranked list then passes through <strong>rules and filters</strong>. That
            includes caps such as at most two tracks per artist in a 30-track playlist,
            <strong>diversity</strong> re-ranking so you don't get ten near-identical songs,
            respecting the user's explicit-content setting, a final <strong>rights check</strong>,
            and for playlists, <strong>sequencing</strong> so the energy flows well from track to
            track.</p>
            <p>Why keep rules separate from the model? They're <strong>hard guarantees</strong>
            rather than tendencies, product can change them without retraining, and they make the
            system debuggable. When someone asks why a track showed up, you can point to a
            score and a rule.</p>`
        }

          title: "Recs deep dive ⑥: batch serving (Discover Weekly)",

            <p>We have a funnel; now, when do we run it? For many surfaces the answer is
            <strong>ahead of time, in batch</strong>.</p>
            <p>Discover Weekly is the canonical example. Every week, a <strong>batch job</strong>
            runs the full funnel for every active user: candidate generation, ranking, and
            rules. It writes a 30-track playlist to the <strong>Recs Store</strong>, and it's also
            materialized as a real playlist through the playlist service. The job is sharded by user
            across a large compute cluster, scheduled over the weekend, and staggered by time zone so
            everyone's playlist is ready Monday morning local time. Daily Mixes and the home-feed
            shelves run the same way on a <strong>daily</strong> cadence.</p>
            <p>A quick sanity check on cost: 600 million users times a couple thousand candidates
            is on the order of a <strong>trillion scoring operations</strong> per run. That sounds
            enormous, but it's embarrassingly parallel and very feasible for a batch cluster
            over many hours. We cut waste by <strong>skipping inactive users</strong> and generating
            their recommendations lazily when they come back.</p>
            <p>The big advantage of batch is that <strong>serving becomes trivial</strong>: a single
            key-value read, a few milliseconds, extremely cheap. It's also resilient, since if the
            entire ML infrastructure is down, yesterday's recommendations are still there. That fits
            our principle that the core experience shouldn't depend on complex systems being
            healthy.</p>
            <p>The disadvantages are <strong>staleness</strong> and <strong>no context</strong>.
            Batch results can't react to the album you started obsessing over an hour ago, or the
            fact that it's Saturday night instead of Monday morning. That's what the online path is
            for.</p>`

          title: "Recs deep dive ⑦: online serving and session context",
          html: `
            <p>Some surfaces have to be computed <strong>in the moment</strong>. Radio, autoplay
            when your album ends, and "more like this" depend on a seed track and on what you're
            doing right now. If you've skipped three ballads in a row, the next track had better
            not be a ballad.</p>
            <p>So the <strong>Recommendation service</strong> has two modes. For batch surfaces,
            it reads from the <strong>Recs Store</strong>. For live surfaces, it runs the same
            funnel online: it calls <strong>candidate generation</strong> with a query vector built
            from the seed track and the session, then the <strong>ranker</strong>, all inside a
            tight budget. A plausible breakdown is about 10 ms for the ANN lookup, about 20 ms for
            feature fetches, and about 30 ms to score a thousand candidates, so we land well under
            100 ms. That's achievable because the expensive work of learning embeddings and models
            was done offline.</p>
            <p>The freshness comes from <strong>session signals</strong>. A streaming job consumes
            the same Kafka play-event topic we built earlier and maintains features like "skips in
            the last ten minutes" and "current session vector" in a low-latency store. That's the
            real-time half of the feature pipeline.</p>
            <p>The home feed is a <strong>hybrid</strong>. The shelves and their contents are
            precomputed daily, then lightly <strong>re-ranked online</strong> by context, for
            example putting the workout mix first at 6 a.m. on a weekday.</p>
            <p>Degradation is layered. If the online path blows its latency budget, fall back to
            the precomputed list. If that's missing, fall back to popular-in-your-region. The
            client always gets <em>something</em> good rather than an error.</p>`

        // --- Slide 24: recs — evaluation + feedback loop ---
        diagram: recs({ add: ["experiment", "b_exp_svc", "b_feedback"] }),
        script: {
          title: "Recs deep dive ⑧: experimentation and the feedback loop",
          html: `
            <p>The last piece is how we <strong>know it's working</strong> and how it keeps getting
            better.</p>
            <p>Offline metrics, like recall or NDCG on held-out listening data, are useful for
            filtering out bad models, but they're only a proxy. The real test is an
            <strong>A/B experiment</strong>. The <strong>experimentation platform</strong>
            deterministically buckets users by hashing their ID, so a user sees a consistent
            variant, and the recommendation service uses that bucket to pick models and
            parameters. We measure short-term metrics like streams per recommendation, save rate,
            and skip rate, but the north star is <strong>long-term engagement and
            retention</strong>, because it's easy to optimize short-term clicks into a worse
            product. For comparing rankers, <strong>interleaving</strong> (mixing two rankers'
            results in one list) detects differences with far less traffic than a classic A/B
            test.</p>
            <p>The dashed line around the outside is the <strong>feedback loop</strong>. Every
            recommendation the client shows is logged as an <strong>impression</strong>, with the
            position and the model version, and joined to what happened next: played, skipped,
            saved. That becomes training data for the next model. Logging impressions, not just
            plays, matters because otherwise we only learn from things we already chose to show,
            and the model collapses into a self-reinforcing popularity loop.</p>
            <p>That's also why we deliberately <strong>explore</strong>. A small fraction of slots
            uses bandit-style exploration to try less-certain tracks and new artists, trading a
            little short-term accuracy for better long-term learning, fairness to new artists, and
            fewer filter bubbles. Brand-new users get a short onboarding to pick a few artists,
            regional popularity in the meantime, and then fast adaptation as signals arrive.</p>
            <p>That closes the loop: listening generates data, data trains models, models drive
            listening. Let's zoom back out.</p>`
        }
      },
      {
        // --- Slide 25: multi-region + resilience (back to the main scene) ---
        diagram: main({ add: ["dns", "regions", "e_client_dns", "e_dns_gateway", "e_replication"] }),
        script: {
          title: "Going global: multi-region and failure handling",
          html: `
            <p>Back to the full architecture. Everything we've drawn so far is effectively
            <strong>one region</strong>. To be global and hit four nines, we run
            <strong>several regions</strong>, say across the Americas, Europe, and Asia-Pacific,
            each with the full stack, <strong>active-active</strong>.</p>
            <p><strong>GeoDNS</strong> (or anycast) sends each user to the nearest healthy region.
            The stateless services just run everywhere. The real question is always data.
            The <strong>catalog</strong> is read-mostly with a tiny write rate from ingestion, so it
            has a single write primary with read replicas in every region. <strong>User data and
            playlists</strong> live in Cassandra with <strong>multi-datacenter replication</strong>,
            writing with local quorum for low latency and replicating asynchronously across regions.
            Our revision-based playlist model handles the rare cross-region conflict. Each region has
            its own Kafka, mirrored into a central data lake for batch processing.</p>
            <p>Then there's <strong>failure handling</strong>, guided by the principle we set at the
            start that playback is sacred. Concretely, we use <strong>timeouts and circuit
            breakers</strong> on every service call so one slow dependency doesn't cascade. We
            <strong>isolate</strong> the playback path's resources from everything else.
            Under overload, we <strong>shed load by priority</strong> at the gateway: drop
            prefetches and analytics before play requests. Each feature has a
            <strong>fallback</strong>: recs fall back to charts, and search failure still leaves the
            library playable. If a CDN vendor degrades, we <strong>fail over to another
            vendor</strong>. And there's <strong>client resilience</strong>: cached tokens, licenses
            and audio mean a user can keep listening to recently played music even if our backend is
            completely unreachable for a while.</p>
            <p>To survive losing a whole region, each region runs with enough <strong>spare
            capacity</strong> to absorb a neighbor's traffic, and we prove it with regular failover
            drills rather than trusting the diagram.</p>`
        }

          title: "The complete system: following one play end to end",
          html: `
            <p>Here's the complete system. Let me tie it together by following a single user through
            it.</p>
            <p>She opens the app. <strong>GeoDNS</strong> routes her to the nearest region, the
            <strong>API gateway</strong> validates her token, and the home screen is assembled from the
            <strong>Recommendation service</strong>. That's mostly a key-value read of shelves the
            <strong>batch pipeline</strong> computed overnight, lightly re-ranked for context, with
            album art from the <strong>CDN</strong> and metadata from the <strong>catalog</strong>,
            nearly all served from <strong>cache</strong>.</p>
            <p>She searches, hitting the <strong>search index</strong> kept fresh by CDC, and taps a
            song. The <strong>Playback service</strong> checks her tier and the track's rights in her
            country and returns signed URLs plus a license. Her <strong>audio player</strong> pulls
            encrypted chunks from a nearby <strong>CDN</strong> edge, almost certainly a cache hit,
            decrypts them, and adapts bitrate as her network changes, while prefetching the next track.
            She taps "play on Living Room", and the <strong>Connect service</strong> pushes the command
            over a WebSocket to her speaker, which starts streaming on its own.</p>
            <p>Every interaction becomes an event: through the <strong>collector</strong> into
            <strong>Kafka</strong>, deduplicated and counted by <strong>stream processing</strong>, and
            landing in the <strong>data lake</strong>. That feeds <strong>royalty reporting</strong>
            so the artist gets paid, and the <strong>recs pipeline</strong>, which learns from it
            and shapes her next Discover Weekly. Meanwhile, on the supply side, labels deliver new
            music through <strong>ingestion</strong> and <strong>transcoding</strong>, announced to
            everyone else via a TrackReady event.</p>
            <p>The theme throughout was recognizing <strong>three different workloads</strong> and
            giving each the right tool. Bandwidth-bound audio goes to immutable files on a CDN.
            Read-heavy metadata goes to stateless services, caches, and replicas. The write-heavy event
            firehose goes to Kafka and stream processing. Across all of it, we protected
            <strong>playback above everything else</strong>.</p>
            <p>With more time, I'd go deeper on podcasts and video, the ads system for the free tier,

    // ========================================================================
    // Engine — shared by every deck. You should not need to edit below here.
    // ========================================================================
    let index = 0;

    const el = {
      topic: document.getElementById("topic"),
      diagram: document.getElementById("diagram"),
      num: document.getElementById("script-num"),
      title: document.getElementById("script-title"),
      body: document.getElementById("script-body"),
      prev: document.getElementById("prev"),
      next: document.getElementById("next"),
      counter: document.getElementById("counter"),
    };

    function render() {
      const slide = SLIDES[index];
      el.topic.textContent = TOPIC;

      // Replace the SVG (keep the #topic badge, which lives before it).
      const existing = el.diagram.querySelector("svg");
      if (existing) existing.remove();
      el.diagram.insertAdjacentHTML("beforeend", slide.diagram);

      el.num.textContent = `Slide ${index + 1} of ${SLIDES.length}`;
      el.title.textContent = slide.script.title;
      el.body.innerHTML = slide.script.html;

      el.counter.textContent = `${index + 1} / ${SLIDES.length}`;
      el.prev.disabled = index === 0;
      el.next.disabled = index === SLIDES.length - 1;

      el.script.scrollTop = 0;
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= SLIDES.length) return;
      index = next;
      render();
    }

    el.prev.addEventListener("click", () => go(-1));
    el.next.addEventListener("click", () => go(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    // #script is referenced in render() for scroll reset.
    el.script = document.getElementById("script");

    render();
  </script>
