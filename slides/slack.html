<!DOCTYPE html>
<!--
  ============================================================================
  SYSTEM DESIGN WALKTHROUGH — DESIGN SLACK
  ============================================================================

  Built from slides/example.html. Same layout, theme, navigation and engine.

    - Slides 1–2: functional / non-functional requirements (card grids).
    - Slides 3–16: one scene (SCENE) that grows from a single chat server to
      the full system. The central arc is real-time delivery: WebSocket push
      (slide 5) → stateless webapp vs. stateful gateways (6) → channel
      servers for per-channel ordering and fan-out (7).

  Navigation (shared by every deck): on-screen back/forward arrows, plus the
  Left/Right arrow keys.

  The file is fully self-contained — no build step, no external dependencies.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Slack — System Design Walkthrough</title>
  <style>
    :root {
      /* ---- Theme tokens (edit here, not inline) ---- */
      --bg: #0f172a;            /* page background */
      --panel: #1e293b;         /* diagram panel */
      --panel-2: #172033;       /* script panel */
      --ink: #e2e8f0;           /* primary text */
      --ink-dim: #94a3b8;       /* secondary text */
      --accent: #38bdf8;        /* highlights, arrows, titles, "new" glow */
      --border: #334155;        /* panel + box borders */

      /* ---- Diagram element colors (used inside the SVGs) ---- */
      --box-fill: #0b1222;
      --box-stroke: #475569;
      --box-ink: #e2e8f0;
      --line: #64748b;
      --client: #38bdf8;        /* clients / users / external actors */
      --service: #a78bfa;       /* app / services   */
      --data: #34d399;          /* data stores      */
      --infra: #facc15;         /* gateways, load balancers, CDN, DNS */
      --stream: #f472b6;        /* queues, event streaming */
      --ml: #fb923c;            /* ML / batch compute */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Deck fills the viewport; diagram on top (large), script on bottom (smaller). */
    #deck {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 12px;
    }

    /* ---- Top: diagram ---- */
    #diagram {
      flex: 1 1 62%;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    #diagram svg { width: 100%; height: 100%; }

    /* Topic badge, top-left of the diagram panel */
    #topic {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    /* ---- Bottom: script ---- */
    #script {
      flex: 0 0 25%;
      min-height: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      overflow-y: auto;
    }
    #script-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    #script-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--bg);
      background: var(--accent);
      border-radius: 999px;
      padding: 3px 11px;
      white-space: nowrap;
    }
    #script-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }
    #script-body {
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink);
    }
    #script-body p { margin: 0 0 10px; }
    #script-body strong { color: var(--ink); }
    #script-body em { color: var(--ink-dim); font-style: normal; }

    /* ---- Controls ---- */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex: 0 0 auto;
    }
    .nav {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
      font-size: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .nav:hover:not(:disabled) { background: var(--border); border-color: var(--accent); }
    .nav:disabled { opacity: 0.35; cursor: default; }
    #counter {
      font-size: 14px;
      color: var(--ink-dim);
      min-width: 70px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Reusable SVG diagram helpers ---- */
    .box rect {
      fill: var(--box-fill);
      stroke: var(--box-stroke);
      stroke-width: 1.5;
      rx: 10;
    }
    .box.client rect { stroke: var(--client); }
    .box.service rect { stroke: var(--service); }
    .box.data rect { stroke: var(--data); }
    .box.infra rect { stroke: var(--infra); }
    .box.stream rect { stroke: var(--stream); }
    .box.ml rect { stroke: var(--ml); }
    /* A layer that other edges pass through (e.g. a cache tier). Drawn behind edges. */
    .box.tier rect { fill: rgba(52, 211, 153, 0.06); stroke-dasharray: 5 5; }
    /* Something that exists but we are not drawing in detail (other regions, 3rd parties). */
    .box.ghost rect { fill: transparent; stroke-dasharray: 7 6; }
    /* Added on the current slide (set automatically by the scene builder). */
    .box.new rect { stroke-width: 3; filter: drop-shadow(0 0 7px var(--accent)); }
    .box text {
      fill: var(--box-ink);
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .box .sub {
      fill: var(--ink-dim);
      font-size: 11px;
      font-weight: 500;
    }
    .edge {
      stroke: var(--line);
      stroke-width: 1.8;
      fill: none;
      marker-end: url(#arrow);
    }
    .edge.both { marker-start: url(#arrow-start); }      /* two-way */
    .edge.plain { marker-end: none; }                    /* no arrowhead */
    .edge.async { stroke-dasharray: 6 5; }               /* async / background flow */
    .edge.new { stroke: var(--accent); marker-end: url(#arrow-new); }
    .edge.new.both { marker-start: url(#arrow-start-new); }
    .edge.new.plain { marker-end: none; }
    .edge-label {
      fill: var(--ink-dim);
      font-size: 11px;
      text-anchor: middle;
      /* Halo in the panel color keeps labels readable where they cross lines. */
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .edge-label.new { fill: var(--accent); }

    /* ---- Requirement slides (slides 1–2) ---- */
    .heading { fill: var(--accent); font-size: 24px; font-weight: 700; }
    .subheading { fill: var(--ink-dim); font-size: 14px; }
    .card rect { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
    .card .badge { fill: var(--accent); }
    .card .badge-num { fill: var(--bg); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .card .title { fill: var(--box-ink); font-size: 17px; font-weight: 700; }
    .card .line { fill: var(--ink-dim); font-size: 13.5px; }
    .panel-box { fill: var(--box-fill); stroke: var(--accent); stroke-width: 1.5; }
    .panel-title { fill: var(--accent); font-size: 17px; font-weight: 700; }
    .strip { fill: transparent; stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 7 6; }
    .strip-title { fill: var(--ink); font-size: 15px; font-weight: 700; }
    .strip-text { fill: var(--ink-dim); font-size: 13.5px; }
    .est-k { fill: var(--accent); font-size: 13.5px; font-weight: 700; }
    .est-v { fill: var(--ink); font-size: 13.5px; }
  </style>
</head>
<body>
  <div id="deck">
    <section id="diagram" aria-label="System diagram">
      <span id="topic"></span>
      <!-- SVG for the active slide is injected here -->
    </section>

    <section id="script" aria-label="Script">
      <div id="script-header">
        <span id="script-num"></span>
        <span id="script-title"></span>
      </div>
      <div id="script-body"></div>
    </section>

    <div id="controls">
      <button class="nav" id="prev" aria-label="Previous slide">&#8592;</button>
      <span id="counter"></span>
      <button class="nav" id="next" aria-label="Next slide">&#8594;</button>
    </div>
  </div>

  <script>
    // ========================================================================
    // EDIT THIS: the system being designed.
    // ========================================================================
    const TOPIC = "Design Slack";

    // Shared <defs>: default arrowhead, a start-reversed variant for two-way
    // edges, and accent-colored variants for edges added on the current slide.
    const DEFS = `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
        <marker id="arrow-start-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
      </defs>`;

    // Labeled box. `kind` is a space-separated class list:
    //   color: "client" | "service" | "data" | "infra" | "stream" | "ml"
    //   style: optionally plus "tier" (pass-through layer) or "ghost" (dashed)
    //   "new" is added automatically by the scene builder.
    // `sub` is an optional second line (e.g. a technology or role note).
    function box(x, y, w, h, label, kind = "", sub = "") {
      const cx = x + w / 2;
      const subText = sub
        ? `<text class="sub" x="${cx}" y="${y + h / 2 + 12}">${sub}</text>`
        : "";
      const labelY = sub ? y + h / 2 - 7 : y + h / 2;
      return `
        <g class="box ${kind}">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <text x="${cx}" y="${labelY}">${label}</text>
          ${subText}
        </g>`;
    }

    // ========================================================================
    // Requirement-slide helpers (slides 1–2). Use viewBox 0 0 1200 640.
    // ========================================================================

    // One numbered requirement card: a title plus 1–3 short lines.
    function card(x, y, w, h, num, title, lines) {
      const body = lines
        .map((l, i) => `<text class="line" x="${x + 18}" y="${y + 66 + i * 21}">${l}</text>`)
        .join("");
      return `
        <g class="card">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <circle class="badge" cx="${x + 30}" cy="${y + 30}" r="13"></circle>
          <text class="badge-num" x="${x + 30}" y="${y + 30}">${num}</text>
          <text class="title" x="${x + 52}" y="${y + 36}">${title}</text>
          ${body}
        </g>`;
    }

    // A grid of cards, numbered 1..N. items = [[title, [line, line]], ...]
    function cardGrid(x0, y0, w, h, gap, cols, items) {
      return items
        .map((it, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          return card(x0 + c * (w + gap), y0 + r * (h + gap), w, h, i + 1, it[0], it[1]);
        })
        .join("");
    }

    // Dashed strip with a title and lines (out-of-scope list, key takeaway).
    function strip(x, y, w, h, title, lines) {
      const body = lines
        .map((l, i) => `<text class="strip-text" x="${x + 24}" y="${y + 64 + i * 22}">${l}</text>`)
        .join("");
      return `
        <rect class="strip" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
        <text class="strip-title" x="${x + 24}" y="${y + 34}">${title}</text>
        ${body}`;
    }

    // Accent-bordered panel of back-of-the-envelope estimates.
    // rows = [[heading, [value, value]], ...]
    function estimatesPanel(x, y, w, h, title, rows) {
      let cy = y + 66;
      const body = rows
        .map(([k, vs]) => {
          let s = `<text class="est-k" x="${x + 20}" y="${cy}">${k}</text>`;
          vs.forEach((v) => { cy += 21; s += `<text class="est-v" x="${x + 20}" y="${cy}">${v}</text>`; });
          cy += 36;
          return s;
        })
        .join("");
      return `
        <rect class="panel-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
        <text class="panel-title" x="${x + 20}" y="${y + 32}">${title}</text>
        ${body}`;
    }

    // ========================================================================
    // Scene builder — shared by every deck. You should not need to edit this.
    //
    //   const scene = sceneBuilder(SCENE);
    //   scene({ add: ["client", "server", "e_client_server"] })  // -> <svg>
    //   scene({ add: ["db", "e_server_db"] })                    // cumulative
    //   scene({ add: [...], remove: ["server"] })                // replace a box
    //   scene()                                                  // no change
    // ========================================================================

    // Edge label position: midpoint of the longest segment. Above horizontal /
    // diagonal segments, to the right of vertical ones. Override with `lp`.
    function labelPos(e) {
      if (e.lp) return e.lp;
      let best = null, len = -1;
      for (let i = 0; i < e.pts.length - 1; i++) {
        const [x1, y1] = e.pts[i], [x2, y2] = e.pts[i + 1];
        const l = Math.hypot(x2 - x1, y2 - y1);
        if (l > len) { len = l; best = [x1, y1, x2, y2]; }
      }
      const [x1, y1, x2, y2] = best;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      return x1 === x2 ? [mx + 7, my + 4, "start"] : [mx, my - 7, "middle"];
    }

    function sceneBuilder(def) {
      const boxes = Object.fromEntries(def.boxes.map((b) => [b.id, b]));
      const visible = new Set();

      return function step({ add = [], remove = [] } = {}) {
        remove.forEach((id) => visible.delete(id));
        add.forEach((id) => visible.add(id));
        const fresh = new Set(add);
        const isOn = (id) => visible.has(id);

        const lines = [], labels = [], back = [], front = [], pts = [];

        const drawEdge = (pathPts, cls, label, lp) => {
          const d = pathPts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join(" ");
          lines.push(`<path class="edge ${cls}" d="${d}"></path>`);
          pathPts.forEach((p) => pts.push(p));
          if (label) {
            const [lx, ly, anchor] = lp;
            const nw = cls.includes("new") ? "new" : "";
            labels.push(`<text class="edge-label ${nw}" x="${lx}" y="${ly}" style="text-anchor:${anchor}">${label}</text>`);
          }
        };

        // Boxes ("tier" boxes go behind the edges, everything else in front).
        def.boxes.forEach((b) => {
          if (!isOn(b.id)) return;
          const kind = `${b.kind}${fresh.has(b.id) ? " new" : ""}`;
          const svg = box(b.x, b.y, b.w, b.h, b.label, kind, b.sub || "");
          (b.kind.includes("tier") ? back : front).push(svg);
          pts.push([b.x, b.y], [b.x + b.w, b.y + b.h]);
        });

        // Explicit edges: shown when added AND both endpoints are visible.
        def.edges.forEach((e) => {
          if (!isOn(e.id) || !isOn(e.from) || !isOn(e.to)) return;
          const cls = [
            fresh.has(e.id) ? "new" : "",
            e.both ? "both" : "",
            e.async ? "async" : "",
          ].join(" ");
          drawEdge(e.pts, cls, e.label, e.label ? labelPos(e) : null);
        });

        // Optional "bus": a hub (gateway / load balancer) fans out to member
        // boxes via a vertical line. Members join the bus as they are added.
        const bus = def.bus;
        if (bus && isOn(bus.hub)) {
          const members = bus.members.filter(isOn).map((id) => boxes[id]);
          if (members.length) {
            const hubNew = fresh.has(bus.hub);
            const ys = members.map((b) => b.y + b.h / 2).concat([bus.hubY]);
            const top = Math.min(...ys), bottom = Math.max(...ys);
            const pn = hubNew ? "new plain" : "plain";
            drawEdge([[bus.hubX, bus.hubY], [bus.x, bus.hubY]], pn, bus.label, bus.lp);
            drawEdge([[bus.x, top], [bus.x, bottom]], pn);
            members.forEach((b) => {
              const y = b.y + b.h / 2;
              drawEdge([[bus.x, y], [b.x, y]], hubNew || fresh.has(b.id) ? "new" : "");
            });
          }
        }

        // Auto-fit the viewBox to what is visible (with a minimum size).
        const pad = 40;
        let x0 = Math.min(...pts.map((p) => p[0])) - pad;
        let y0 = Math.min(...pts.map((p) => p[1])) - pad;
        let x1 = Math.max(...pts.map((p) => p[0])) + pad;
        let y1 = Math.max(...pts.map((p) => p[1])) + pad;
        const minW = 900, minH = 460;
        if (x1 - x0 < minW) { const g = (minW - (x1 - x0)) / 2; x0 -= g; x1 += g; }
        if (y1 - y0 < minH) { const g = (minH - (y1 - y0)) / 2; y0 -= g; y1 += g; }

        return `
          <svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" xmlns="http://www.w3.org/2000/svg">
            ${DEFS}
            ${back.join("")}
            ${lines.join("")}
            ${front.join("")}
            ${labels.join("")}
          </svg>`;
      };
    }

    // ========================================================================
    // EDIT THIS: the scene — every component of the FINAL system.
    //
    // Layout tips:
    //   - Sketch the final diagram first; lay it out in columns
    //     (clients | edge/infra | services | data | async) with a fixed row
    //     pitch (~70px for 54px-tall boxes) so horizontal edges line up.
    //   - Aim for a wide, short canvas (roughly 2:1 or wider); the diagram
    //     panel is much wider than it is tall.
    //   - Box: { id, x, y, w, h, label, kind, sub }. Keep labels short enough
    //     for the box width (~8px per character at 15px bold).
    //   - Edge: { id, from, to, pts: [[x,y], ...], label?, lp?, both?, async? }
    //     `pts` is a polyline; route around boxes through the gaps between
    //     columns. `lp: [x, y, "start" | "middle"]` overrides label placement.
    //   - A box that only exists early on (e.g. a monolithic "server") can
    //     share space with boxes that replace it later; remove it on the
    //     slide that splits it up.
    // ========================================================================
    const SCENE = {
      boxes: [
        // Clients
        { id: "client",    x: 40,   y: 90,  w: 170, h: 370, label: "Slack Clients", kind: "client", sub: "desktop · web · mobile" },
        // Edge / infra
        { id: "cdn",       x: 280,  y: 20,  w: 170, h: 54,  label: "CDN", kind: "infra", sub: "file downloads" },
        { id: "flannel",   x: 280,  y: 90,  w: 170, h: 54,  label: "Edge Cache", kind: "infra", sub: "Flannel · boot data" },
        { id: "lb",        x: 280,  y: 230, w: 170, h: 54,  label: "Load Balancer", kind: "infra", sub: "HTTPS API" },
        { id: "gw",        x: 280,  y: 370, w: 170, h: 124, label: "Gateway Servers", kind: "infra", sub: "WebSockets · stateful" },
        // Slides 3–5 only: the naive single server (same spot as the webapp)
        { id: "server",    x: 530,  y: 160, w: 190, h: 124, label: "Chat Server", kind: "service", sub: "one process does it all" },
        // Services
        { id: "file",      x: 530,  y: 20,  w: 190, h: 54,  label: "File Service", kind: "service", sub: "upload · signed URLs" },
        { id: "search",    x: 530,  y: 90,  w: 190, h: 54,  label: "Search Service", kind: "service", sub: "permission-aware" },
        { id: "webapp",    x: 530,  y: 160, w: 190, h: 124, label: "Webapp (API)", kind: "service", sub: "stateless · any request" },
        { id: "cs",        x: 530,  y: 370, w: 190, h: 124, label: "Channel Servers", kind: "service", sub: "pub/sub · hashed by channel" },
        { id: "presence",  x: 530,  y: 510, w: 190, h: 54,  label: "Presence Service", kind: "service", sub: "in-memory · by user" },
        // Data
        { id: "blob",      x: 800,  y: 20,  w: 180, h: 54,  label: "Blob Store", kind: "data", sub: "files · thumbnails" },
        { id: "searchidx", x: 800,  y: 90,  w: 180, h: 54,  label: "Search Index", kind: "data", sub: "per workspace" },
        { id: "db",        x: 800,  y: 160, w: 180, h: 124, label: "Database", kind: "data", sub: "MySQL · one primary" },
        { id: "vitess",    x: 800,  y: 160, w: 180, h: 124, label: "Vitess (MySQL)", kind: "data", sub: "by channel · workspace" },
        { id: "queue",     x: 800,  y: 300, w: 180, h: 54,  label: "Job Queue", kind: "stream", sub: "Kafka + Redis" },
        // Async workers and the outside world
        { id: "indexer",   x: 1050, y: 90,  w: 190, h: 54,  label: "Search Indexer", kind: "service", sub: "async · seconds" },
        { id: "regions",   x: 1050, y: 160, w: 190, h: 54,  label: "Other Regions ×N", kind: "ghost", sub: "edge PoPs · standbys" },
        { id: "notif",     x: 1050, y: 300, w: 190, h: 54,  label: "Notification Workers", kind: "service", sub: "who · when · dedupe" },
        { id: "push",      x: 1050, y: 440, w: 190, h: 54,  label: "APNs / FCM · Email", kind: "ghost", sub: "third parties" },
      ],
      edges: [
        // Naive starting point
        { id: "e_client_server", from: "client", to: "server", pts: [[210, 222], [530, 222]], label: "HTTPS", both: true },
        { id: "e_server_db", from: "server", to: "db", pts: [[720, 222], [800, 222]], label: "SQL", both: true },
        { id: "e_client_server_ws", from: "client", to: "server", pts: [[210, 262], [530, 262]], label: "WebSocket (push)", both: true },
        // Stateless API vs. stateful connections
        { id: "e_client_lb", from: "client", to: "lb", pts: [[210, 257], [280, 257]], label: "HTTPS", both: true },
        { id: "e_client_gw", from: "client", to: "gw", pts: [[210, 420], [280, 420]], label: "WebSocket", both: true },

            requirement showing up in the async path.</p>
            <p>The queue also <strong>absorbs bursts</strong>. If traffic triples at 9 a.m., the
            queue gets longer for a few minutes, while real-time delivery, which never touches
            the queue, stays fast. That's the general shape of the design: keep the
            latency-critical path as short as possible and make everything else
            asynchronous.</p>`
        }
      },
      {
        // --- Slide 12: notifications ---
        diagram: scene({ add: ["notif", "push", "e_queue_notif", "e_notif_push"] }),
        script: {
          title: "Notifications: deciding who to bother, and when",
          html: `
            <p>The first consumer of the queue is <strong>notifications</strong>. For every new
            message, the notification workers decide whether and how to notify each member. A
            lot of product complexity lives here, so it's worth walking through the
            decision.</p>
            <p>You're notified if the message is a DM, mentions you, mentions a group you're in
            (@here, @channel, a user group), matches one of your keywords, or is in a channel you
            follow closely. It's suppressed if you've muted the channel, turned on Do Not
            Disturb, are outside your notification schedule, or <strong>already saw it</strong>.
            That last one matters most: if you're active in the desktop app, your phone
            shouldn't buzz. So the workers check <strong>presence</strong> and your
            <strong>read cursor</strong>, and they usually wait a short delay before a mobile
            push in case another device reads the message first.</p>
            <p>Delivery goes to <strong>APNs and FCM</strong> for mobile push and to an email
            provider for digests. They're third parties, so they're drawn as ghosts. The workers
            <strong>dedupe</strong> by message and device, retry with backoff, and prune dead
            device tokens.</p>
            <p>Notice the big-channel problem coming back. An <em>@channel</em> in a
            100,000-person channel is 100,000 decisions. Because it's an async job, it can be
            split into batches across many workers. The last phone might buzz a few seconds
            later, which is fine for push. Real-time delivery to everyone online already happened
            through the channel servers.</p>`
        }
      },
      {
        // --- Slide 13: search ---
        diagram: scene({ add: ["search", "searchidx", "indexer", "e_search_idx", "e_queue_indexer", "e_indexer_idx"] }),
        script: {
          title: "Search that respects permissions",
          html: `
            <p>Search comes next, and Slack's has a twist most search systems don't:
            <strong>results must respect permissions</strong>. You must never see a hit from a
            private channel you're not in, not even a snippet or a count.</p>
            <p>The pipeline: the <strong>search indexer</strong> consumes message jobs (new
            messages, edits, deletes) from the queue, tokenizes them, and writes them to a
            <strong>search index</strong>, an inverted index on Solr or Elasticsearch. The
            index is <strong>partitioned by workspace</strong>, so a query only touches its own
            tenant's shards, and the biggest enterprises can get dedicated ones. Indexing is
            asynchronous, so a brand-new message may take a few seconds to become searchable,
            which users accept.</p>
            <p>The <strong>search service</strong> answers queries. Each indexed message carries
            its <em>channel_id</em>, and every query is filtered to the channels the user can
            read. Enforcing access at query time, rather than storing an access list per user
            per document, means nothing in the index changes when someone joins or leaves a
            channel. For people in thousands of channels, we cache their channel set and filter
            efficiently.</p>
            <p>Ranking goes beyond text match: recency, whether you're in the channel, whether
            the author is someone you work with, and engagement like replies and reactions. The
            other piece to get right is <strong>deletion</strong>. When a message is deleted or a
            retention policy expires it, the delete has to reach the index promptly. A deleted
            message still showing up in search is a trust problem, not just a bug.</p>`
        }
      },
      {
        // --- Slide 14: files ---
        diagram: scene({ add: ["file", "blob", "cdn", "e_file_blob", "e_cdn_client", "e_cdn_blob"] }),
        script: {
          title: "Files: blob storage, signed URLs and a CDN",
          html: `
            <p>Files get shared constantly: screenshots, PDFs, logs. They're <strong>large,
            immutable and read many times</strong>, which is exactly what a relational database
            is bad at, so they never go in MySQL.</p>
            <p>The <strong>file service</strong> owns metadata and permissions. To upload, the
            client asks for an upload slot and gets back a <strong>pre-signed URL</strong>, then
            sends the bytes directly to the <strong>blob store</strong> (S3-style object
            storage), so big uploads don't tie up webapp servers. When the upload finishes, the
            file service records the metadata (owner, channel, size, type) and posts a message
            that references the file. Async workers then generate <strong>thumbnails and
            previews</strong> and scan for malware.</p>
            <p>Downloads go through the <strong>CDN</strong>. The subtlety is that these files
            are <strong>private</strong>: a public CDN link to a confidential PDF is a data leak.
            So the file service hands out <strong>short-lived signed URLs</strong>, and only
            after checking that the requester can see the channel the file was shared in. The
            CDN caches the bytes, and the signature limits who can fetch them and for how
            long.</p>
            <p>Files are also by far the biggest storage cost, far more than message text.
            Lifecycle rules move older files to cheaper storage tiers, and workspace retention
            settings can delete them entirely. A delete has to cascade to thumbnails, CDN caches
            and the search index.</p>`
        }
      },
      {
        // --- Slide 15: multi-region ---
        diagram: scene({ add: ["regions", "e_vitess_regions"] }),
        script: {
          title: "Going global: edge regions and home regions",
          html: `
            <p>Last, geography. Two different requirements push us to multiple regions, and
            they want slightly different things.</p>
            <p><strong>Latency</strong> wants the connection tier near users. A WebSocket from
            Sydney to Virginia adds a couple of hundred milliseconds to every event. So we deploy
            <strong>gateway servers and the edge cache in edge regions</strong> around the
            world. Clients connect to the nearest one, and the long hop back to the workspace's
            region runs over our own backbone on connections that are already warm.</p>
            <p><strong>Data residency</strong> wants data in a specific place: a European
            customer may require that its messages are stored only in the EU. So every workspace
            has a <strong>home region</strong> where its shards, files and search index live.
            This is easy precisely because we shard by tenant and channel. Placement is a
            property of the workspace, not of individual rows.</p>
            <p>For availability, each home region replicates to a standby in another region (the
            dashed line), so we can fail a region over, and within a region every tier is spread
            across availability zones. What we're <strong>not</strong> doing is active-active
            writes to the same channel in two regions. That would break the single-owner
            ordering the channel servers give us, and chat users notice out-of-order messages
            far more than an extra 100 ms.</p>
            <p>The hard edge case is a channel shared by two companies with different home
            regions. That's Slack Connect, which we put out of scope at the start.</p>`
        }
      },
      {
        // --- Slide 16: the complete system ---
        diagram: scene(),
        script: {
          title: "The complete system: following one message end to end",
          html: `
            <p>To close, let me follow one message through the finished system. Alice, in
            London, types "deploy is green" in #eng and hits enter.</p>
            <p>Her client <strong>POSTs</strong> through the load balancer to a
            <strong>webapp</strong> server, with a client-generated ID so a retry can't
            duplicate it. The webapp checks that she's a member, writes the message to the
            <strong>Vitess</strong> shard for #eng (replicated before it acks), and
            <strong>publishes</strong> it to the <strong>channel server</strong> that owns
            #eng. That server fans it out to every <strong>gateway</strong> with a subscriber,
            and the gateways push it down the <strong>WebSockets</strong> of members who are
            online, in channel order, in well under half a second. Meanwhile the webapp has
            <strong>enqueued a job</strong>: the <strong>indexer</strong> makes the message
            searchable within seconds, and the <strong>notification workers</strong> find the
            members who are offline or mentioned and haven't read it, and push to their
            phones.</p>
            <p>Bob's laptop was asleep. It reconnects through the nearest
            <strong>edge</strong>, boots from the <strong>edge cache</strong>, and asks for
            everything in his channels after his last ts. No message is lost and nothing is
            reloaded from scratch. His unread badge comes from his read cursor, and clearing it
            on one device clears it on all of them.</p>
            <p>The themes I'd underline: a <strong>stateless API kept separate from a stateful
            connection tier</strong>; <strong>one owner per channel</strong>, which gives
            ordering and a fan-out cost that scales with gateways, not members; the
            <strong>database as the source of truth</strong>, with sockets as a best-effort fast
            path backed by ts-based catch-up; <strong>sharding by tenant and channel</strong>
            for isolation, residency and scale; and an <strong>async job queue</strong> for
            everything nobody is waiting on. With more time, I'd go deeper next on Slack Connect
            across organizations, enterprise retention and compliance, and the platform for bots
            and workflows.</p>`
        }
      }
    ];

    // ========================================================================
    // Engine — shared by every deck. You should not need to edit below here.
    // ========================================================================
    let index = 0;

    const el = {
      topic: document.getElementById("topic"),
      diagram: document.getElementById("diagram"),
      num: document.getElementById("script-num"),
      title: document.getElementById("script-title"),
      body: document.getElementById("script-body"),
      prev: document.getElementById("prev"),
      next: document.getElementById("next"),
      counter: document.getElementById("counter"),
    };

    function render() {
      const slide = SLIDES[index];
      el.topic.textContent = TOPIC;

      // Replace the SVG (keep the #topic badge, which lives before it).
      const existing = el.diagram.querySelector("svg");
      if (existing) existing.remove();
      el.diagram.insertAdjacentHTML("beforeend", slide.diagram);

      el.num.textContent = `Slide ${index + 1} of ${SLIDES.length}`;
      el.title.textContent = slide.script.title;
      el.body.innerHTML = slide.script.html;

      el.counter.textContent = `${index + 1} / ${SLIDES.length}`;
      el.prev.disabled = index === 0;
      el.next.disabled = index === SLIDES.length - 1;

      el.script.scrollTop = 0;
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= SLIDES.length) return;
      index = next;
      render();
    }

    el.prev.addEventListener("click", () => go(-1));
    el.next.addEventListener("click", () => go(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    // #script is referenced in render() for scroll reset.
    el.script = document.getElementById("script");

    render();
  </script>
</body>
