<!DOCTYPE html>
<!--
  ============================================================================
  SYSTEM DESIGN WALKTHROUGH — EXAMPLE / TEMPLATE DECK
  ============================================================================

  This file is the canonical starting point for a new deck. Copy it to
  slides/<topic>.html (kebab-cased topic name) and replace:

    1. <title> and the TOPIC constant below  -> the system being designed
    2. The requirement cards on slides 1–2   -> the agreed requirements
    3. SCENE (boxes, edges, bus)             -> every component of the FINAL
                                                system, at its final position
    4. The SLIDES array                      -> one entry per step of the design

  Deck structure:
    - Slide 1: functional requirements (card grid + out-of-scope strip).
    - Slide 2: non-functional requirements (card grid + back-of-the-envelope
               panel + takeaway strip).
    - Slide 3: the simplest possible starting point (e.g. one client, one
               server). Each later slide adds ONE more layer/entity/concept.
    - Last slide: the complete system.

  Each slide has two parts:
    - diagram: an <svg> string. Requirement slides build it from the card
               helpers. Architecture slides get it from the scene builder:
               `scene({ add: [...], remove: [...] })`.
    - script:  { title, html } — what the engineer says out loud for this step.
               The concatenation of every slide's script, slide 1..N, is the full
               answer to "Design X." Keep it high-level, explain the WHY and the
               trade-offs, and aim for ~30 min of reading total (up to 60 for
               complex topics).

  THE SCENE BUILDER (how architecture diagrams are made)
    - Declare every box and edge ONCE, at its position in the final diagram.
    - Each slide calls the builder with the ids it adds (and, rarely, removes).
      Visibility is cumulative, so slide N shows everything from slides 3..N.
    - Elements added on the current slide are highlighted: boxes glow, edges
      and their labels turn the accent color. This is how the audience sees
      "the one new thing" on each slide.
    - An edge is only drawn when it has been added AND both of its endpoints
      are visible, so removing a box hides its edges automatically.
    - The viewBox auto-fits the visible elements (with a minimum size), so
      early slides with two boxes are not tiny and the "camera" widens as
      the system grows.
    - Call the builder in slide order: it is stateful. A deck may have more
      than one scene (e.g. a zoomed-in deep dive); create one builder per
      scene and keep calling each in order.

  Navigation (shared by every deck): on-screen back/forward arrows, plus the
  Left/Right arrow keys.

  The file is fully self-contained — no build step, no external dependencies.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Example — System Design Walkthrough</title>
  <style>
    :root {
      /* ---- Theme tokens (edit here, not inline) ---- */
      --bg: #0f172a;            /* page background */
      --panel: #1e293b;         /* diagram panel */
      --panel-2: #172033;       /* script panel */
      --ink: #e2e8f0;           /* primary text */
      --ink-dim: #94a3b8;       /* secondary text */
      --accent: #38bdf8;        /* highlights, arrows, titles, "new" glow */
      --border: #334155;        /* panel + box borders */

      /* ---- Diagram element colors (used inside the SVGs) ---- */
      --box-fill: #0b1222;
      --box-stroke: #475569;
      --box-ink: #e2e8f0;
      --line: #64748b;
      --client: #38bdf8;        /* clients / users / external actors */
      --service: #a78bfa;       /* app / services   */
      --data: #34d399;          /* data stores      */
      --infra: #facc15;         /* gateways, load balancers, CDN, DNS */
      --stream: #f472b6;        /* queues, event streaming */
      --ml: #fb923c;            /* ML / batch compute */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Deck fills the viewport; diagram on top (large), script on bottom (smaller). */
    #deck {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 12px;
    }

    /* ---- Top: diagram ---- */
    #diagram {
      flex: 1 1 62%;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    #diagram svg { width: 100%; height: 100%; }

    /* Topic badge, top-left of the diagram panel */
    #topic {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    /* ---- Bottom: script ---- */
    #script {
      flex: 0 0 25%;
      min-height: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      overflow-y: auto;
    }
    #script-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    #script-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--bg);
      background: var(--accent);
      border-radius: 999px;
      padding: 3px 11px;
      white-space: nowrap;
    }
    #script-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }
    #script-body {
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink);
    }
    #script-body p { margin: 0 0 10px; }
    #script-body strong { color: var(--ink); }
    #script-body em { color: var(--ink-dim); font-style: normal; }

    /* ---- Controls ---- */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex: 0 0 auto;
    }
    .nav {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
      font-size: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .nav:hover:not(:disabled) { background: var(--border); border-color: var(--accent); }
    .nav:disabled { opacity: 0.35; cursor: default; }
    #counter {
      font-size: 14px;
      color: var(--ink-dim);
      min-width: 70px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Reusable SVG diagram helpers ---- */
    .box rect {
      fill: var(--box-fill);
      stroke: var(--box-stroke);
      stroke-width: 1.5;
      rx: 10;
    }
    .box.client rect { stroke: var(--client); }
    .box.service rect { stroke: var(--service); }
    .box.data rect { stroke: var(--data); }
    .box.infra rect { stroke: var(--infra); }
    .box.stream rect { stroke: var(--stream); }
    .box.ml rect { stroke: var(--ml); }
    /* A layer that other edges pass through (e.g. a cache tier). Drawn behind edges. */
    .box.tier rect { fill: rgba(52, 211, 153, 0.06); stroke-dasharray: 5 5; }
    /* Something that exists but we are not drawing in detail (other regions, 3rd parties). */
    .box.ghost rect { fill: transparent; stroke-dasharray: 7 6; }
    /* Added on the current slide (set automatically by the scene builder). */
    .box.new rect { stroke-width: 3; filter: drop-shadow(0 0 7px var(--accent)); }
    .box text {
      fill: var(--box-ink);
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .box .sub {
      fill: var(--ink-dim);
      font-size: 11px;
      font-weight: 500;
    }
    .edge {
      stroke: var(--line);
      stroke-width: 1.8;
      fill: none;
      marker-end: url(#arrow);
    }
    .edge.both { marker-start: url(#arrow-start); }      /* two-way */
    .edge.plain { marker-end: none; }                    /* no arrowhead */
    .edge.async { stroke-dasharray: 6 5; }               /* async / background flow */
    .edge.new { stroke: var(--accent); marker-end: url(#arrow-new); }
    .edge.new.both { marker-start: url(#arrow-start-new); }
    .edge.new.plain { marker-end: none; }
    .edge-label {
      fill: var(--ink-dim);
      font-size: 11px;
      text-anchor: middle;
      /* Halo in the panel color keeps labels readable where they cross lines. */
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .edge-label.new { fill: var(--accent); }

    /* ---- Requirement slides (slides 1–2) ---- */
    .heading { fill: var(--accent); font-size: 24px; font-weight: 700; }
    .subheading { fill: var(--ink-dim); font-size: 14px; }
    .card rect { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
    .card .badge { fill: var(--accent); }
    .card .badge-num { fill: var(--bg); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .card .title { fill: var(--box-ink); font-size: 17px; font-weight: 700; }
    .card .line { fill: var(--ink-dim); font-size: 13.5px; }
    .panel-box { fill: var(--box-fill); stroke: var(--accent); stroke-width: 1.5; }
    .panel-title { fill: var(--accent); font-size: 17px; font-weight: 700; }
    .strip { fill: transparent; stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 7 6; }
    .strip-title { fill: var(--ink); font-size: 15px; font-weight: 700; }
    .strip-text { fill: var(--ink-dim); font-size: 13.5px; }
    .est-k { fill: var(--accent); font-size: 13.5px; font-weight: 700; }
    .est-v { fill: var(--ink); font-size: 13.5px; }
  </style>
</head>
<body>
  <div id="deck">
    <section id="diagram" aria-label="System diagram">
      <span id="topic"></span>
      <!-- SVG for the active slide is injected here -->
    </section>

    <section id="script" aria-label="Script">
      <div id="script-header">
        <span id="script-num"></span>
        <span id="script-title"></span>
      </div>
      <div id="script-body"></div>
    </section>

    <div id="controls">
      <button class="nav" id="prev" aria-label="Previous slide">&#8592;</button>
      <span id="counter"></span>
      <button class="nav" id="next" aria-label="Next slide">&#8594;</button>
    </div>
  </div>

  <script>
    // ========================================================================
    // EDIT THIS: the system being designed.
    // ========================================================================
    const TOPIC = "Design Example";

    // Shared <defs>: default arrowhead, a start-reversed variant for two-way
    // edges, and accent-colored variants for edges added on the current slide.
    const DEFS = `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
        <marker id="arrow-start-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
      </defs>`;

    // Labeled box. `kind` is a space-separated class list:
    //   color: "client" | "service" | "data" | "infra" | "stream" | "ml"
    //   style: optionally plus "tier" (pass-through layer) or "ghost" (dashed)
    //   "new" is added automatically by the scene builder.
    // `sub` is an optional second line (e.g. a technology or role note).
    function box(x, y, w, h, label, kind = "", sub = "") {
      const cx = x + w / 2;
      const subText = sub
        ? `<text class="sub" x="${cx}" y="${y + h / 2 + 12}">${sub}</text>`
        : "";
      const labelY = sub ? y + h / 2 - 7 : y + h / 2;
      return `
        <g class="box ${kind}">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <text x="${cx}" y="${labelY}">${label}</text>
          ${subText}
        </g>`;
    }

    // ========================================================================
    // Requirement-slide helpers (slides 1–2). Use viewBox 0 0 1200 640.
    // ========================================================================

    // One numbered requirement card: a title plus 1–3 short lines.
    function card(x, y, w, h, num, title, lines) {
      const body = lines
        .map((l, i) => `<text class="line" x="${x + 18}" y="${y + 66 + i * 21}">${l}</text>`)
        .join("");
      return `
        <g class="card">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <circle class="badge" cx="${x + 30}" cy="${y + 30}" r="13"></circle>
          <text class="badge-num" x="${x + 30}" y="${y + 30}">${num}</text>
          <text class="title" x="${x + 52}" y="${y + 36}">${title}</text>
          ${body}
        </g>`;
    }

    // A grid of cards, numbered 1..N. items = [[title, [line, line]], ...]
    function cardGrid(x0, y0, w, h, gap, cols, items) {
      return items
        .map((it, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          return card(x0 + c * (w + gap), y0 + r * (h + gap), w, h, i + 1, it[0], it[1]);
        })
        .join("");
    }

    // Dashed strip with a title and lines (out-of-scope list, key takeaway).
    function strip(x, y, w, h, title, lines) {
      const body = lines
        .map((l, i) => `<text class="strip-text" x="${x + 24}" y="${y + 64 + i * 22}">${l}</text>`)
        .join("");
      return `
        <rect class="strip" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
        <text class="strip-title" x="${x + 24}" y="${y + 34}">${title}</text>
        ${body}`;
    }

    // Accent-bordered panel of back-of-the-envelope estimates.
    // rows = [[heading, [value, value]], ...]
    function estimatesPanel(x, y, w, h, title, rows) {
      let cy = y + 66;
      const body = rows
        .map(([k, vs]) => {
          let s = `<text class="est-k" x="${x + 20}" y="${cy}">${k}</text>`;
          vs.forEach((v) => { cy += 21; s += `<text class="est-v" x="${x + 20}" y="${cy}">${v}</text>`; });
          cy += 36;
          return s;
        })
        .join("");
      return `
        <rect class="panel-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
        <text class="panel-title" x="${x + 20}" y="${y + 32}">${title}</text>
        ${body}`;
    }

    // ========================================================================
    // Scene builder — shared by every deck. You should not need to edit this.
    //
    //   const scene = sceneBuilder(SCENE);
    //   scene({ add: ["client", "server", "e_client_server"] })  // -> <svg>
    //   scene({ add: ["db", "e_server_db"] })                    // cumulative
    //   scene({ add: [...], remove: ["server"] })                // replace a box
    //   scene()                                                  // no change
    // ========================================================================

    // Edge label position: midpoint of the longest segment. Above horizontal /
    // diagonal segments, to the right of vertical ones. Override with `lp`.
    function labelPos(e) {
      if (e.lp) return e.lp;
      let best = null, len = -1;
      for (let i = 0; i < e.pts.length - 1; i++) {
        const [x1, y1] = e.pts[i], [x2, y2] = e.pts[i + 1];
        const l = Math.hypot(x2 - x1, y2 - y1);
        if (l > len) { len = l; best = [x1, y1, x2, y2]; }
      }
      const [x1, y1, x2, y2] = best;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      return x1 === x2 ? [mx + 7, my + 4, "start"] : [mx, my - 7, "middle"];
    }

    function sceneBuilder(def) {
      const boxes = Object.fromEntries(def.boxes.map((b) => [b.id, b]));
      const visible = new Set();

      return function step({ add = [], remove = [] } = {}) {
        remove.forEach((id) => visible.delete(id));
        add.forEach((id) => visible.add(id));
        const fresh = new Set(add);
        const isOn = (id) => visible.has(id);

        const lines = [], labels = [], back = [], front = [], pts = [];

        const drawEdge = (pathPts, cls, label, lp) => {
          const d = pathPts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join(" ");
          lines.push(`<path class="edge ${cls}" d="${d}"></path>`);
          pathPts.forEach((p) => pts.push(p));
          if (label) {
            const [lx, ly, anchor] = lp;
            const nw = cls.includes("new") ? "new" : "";
            labels.push(`<text class="edge-label ${nw}" x="${lx}" y="${ly}" style="text-anchor:${anchor}">${label}</text>`);
          }
        };

        // Boxes ("tier" boxes go behind the edges, everything else in front).
        def.boxes.forEach((b) => {
          if (!isOn(b.id)) return;
          const kind = `${b.kind}${fresh.has(b.id) ? " new" : ""}`;
          const svg = box(b.x, b.y, b.w, b.h, b.label, kind, b.sub || "");
          (b.kind.includes("tier") ? back : front).push(svg);
          pts.push([b.x, b.y], [b.x + b.w, b.y + b.h]);
        });

        // Explicit edges: shown when added AND both endpoints are visible.
        def.edges.forEach((e) => {
          if (!isOn(e.id) || !isOn(e.from) || !isOn(e.to)) return;
          const cls = [
            fresh.has(e.id) ? "new" : "",
            e.both ? "both" : "",
            e.async ? "async" : "",
          ].join(" ");
          drawEdge(e.pts, cls, e.label, e.label ? labelPos(e) : null);
        });

        // Optional "bus": a hub (gateway / load balancer) fans out to member
        // boxes via a vertical line. Members join the bus as they are added.
        const bus = def.bus;
        if (bus && isOn(bus.hub)) {
          const members = bus.members.filter(isOn).map((id) => boxes[id]);
          if (members.length) {
            const hubNew = fresh.has(bus.hub);
            const ys = members.map((b) => b.y + b.h / 2).concat([bus.hubY]);
            const top = Math.min(...ys), bottom = Math.max(...ys);
            const pn = hubNew ? "new plain" : "plain";
            drawEdge([[bus.hubX, bus.hubY], [bus.x, bus.hubY]], pn, bus.label, bus.lp);
            drawEdge([[bus.x, top], [bus.x, bottom]], pn);
            members.forEach((b) => {
              const y = b.y + b.h / 2;
              drawEdge([[bus.x, y], [b.x, y]], hubNew || fresh.has(b.id) ? "new" : "");
            });
          }
        }

        // Auto-fit the viewBox to what is visible (with a minimum size).
        const pad = 40;
        let x0 = Math.min(...pts.map((p) => p[0])) - pad;
        let y0 = Math.min(...pts.map((p) => p[1])) - pad;
        let x1 = Math.max(...pts.map((p) => p[0])) + pad;
        let y1 = Math.max(...pts.map((p) => p[1])) + pad;
        const minW = 900, minH = 460;
        if (x1 - x0 < minW) { const g = (minW - (x1 - x0)) / 2; x0 -= g; x1 += g; }
        if (y1 - y0 < minH) { const g = (minH - (y1 - y0)) / 2; y0 -= g; y1 += g; }

        return `
          <svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" xmlns="http://www.w3.org/2000/svg">
            ${DEFS}
            ${back.join("")}
            ${lines.join("")}
            ${front.join("")}
            ${labels.join("")}
          </svg>`;
      };
    }

    // ========================================================================
    // EDIT THIS: the scene — every component of the FINAL system.
    //
    // Layout tips:
    //   - Sketch the final diagram first; lay it out in columns
    //     (clients | edge/infra | services | data | async) with a fixed row
    //     pitch (~70px for 54px-tall boxes) so horizontal edges line up.
    //   - Aim for a wide, short canvas (roughly 2:1 or wider); the diagram
    //     panel is much wider than it is tall.
    //   - Box: { id, x, y, w, h, label, kind, sub }. Keep labels short enough
    //     for the box width (~8px per character at 15px bold).
    //   - Edge: { id, from, to, pts: [[x,y], ...], label?, lp?, both?, async? }
    //     `pts` is a polyline; route around boxes through the gaps between
    //     columns. `lp: [x, y, "start" | "middle"]` overrides label placement.
    //   - A box that only exists early on (e.g. a monolithic "server") can
    //     share space with boxes that replace it later; remove it on the
    //     slide that splits it up.
    // ========================================================================
    const SCENE = {
      boxes: [
        { id: "client",  x: 40,  y: 200, w: 170, h: 70, label: "Client", kind: "client", sub: "1 user" },
        { id: "lb",      x: 290, y: 200, w: 160, h: 70, label: "Load Balancer", kind: "infra", sub: "L7 · health checks" },
        { id: "server",  x: 530, y: 200, w: 180, h: 70, label: "Server", kind: "service", sub: "App process" },
        { id: "app1",    x: 530, y: 120, w: 180, h: 64, label: "App Server 1", kind: "service", sub: "stateless" },
        { id: "app2",    x: 530, y: 290, w: 180, h: 64, label: "App Server 2", kind: "service", sub: "stateless" },
        { id: "cache",   x: 745, y: 90,  w: 90,  h: 290, label: "Cache", kind: "data tier", sub: "Redis" },
        { id: "db",      x: 860, y: 200, w: 170, h: 70, label: "Database", kind: "data", sub: "Persistent store" },
        { id: "queue",   x: 860, y: 420, w: 170, h: 64, label: "Job Queue", kind: "stream", sub: "async work" },
        { id: "worker",  x: 1100, y: 420, w: 170, h: 64, label: "Workers", kind: "service", sub: "background jobs" },
        { id: "email",   x: 1100, y: 560, w: 170, h: 64, label: "Email Provider", kind: "ghost", sub: "third party" },
      ],
      edges: [
        { id: "e_client_server", from: "client", to: "server", pts: [[210, 235], [530, 235]], label: "HTTP", both: true },
        { id: "e_server_db", from: "server", to: "db", pts: [[710, 235], [860, 235]], label: "read / write" },
        { id: "e_client_lb", from: "client", to: "lb", pts: [[210, 235], [290, 235]], label: "HTTPS", both: true },
        { id: "e_app1_db", from: "app1", to: "db", pts: [[710, 152], [860, 220]] },
        { id: "e_app2_db", from: "app2", to: "db", pts: [[710, 322], [860, 250]] },
        { id: "e_app2_queue", from: "app2", to: "queue", pts: [[620, 354], [620, 452], [860, 452]], label: "enqueue", async: true },
        { id: "e_queue_worker", from: "queue", to: "worker", pts: [[1030, 452], [1100, 452]] },
        { id: "e_worker_email", from: "worker", to: "email", pts: [[1185, 484], [1185, 560]], label: "send" },
      ],
      // Optional: the load balancer fans out to the app servers along a bus.
      bus: { hub: "lb", hubX: 450, hubY: 235, x: 490, members: ["app1", "app2"] },
    };

    const scene = sceneBuilder(SCENE);

    // ========================================================================
    // EDIT THIS: one entry per step of the design.
    // ========================================================================
    const SLIDES = [
      {
        // --- Slide 1: functional requirements ---
        diagram: `
          <svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
            <text class="heading" x="30" y="42">Functional requirements</text>
            <text class="subheading" x="330" y="42">what a user can do</text>
            ${cardGrid(30, 66, 370, 128, 15, 3, [
              ["Requirement one", ["Short description, line one", "Optional second line"]],
              ["Requirement two", ["Short description, line one", "Optional second line"]],
              ["Requirement three", ["Short description, line one", "Optional second line"]],
              ["Requirement four", ["Short description, line one", "Optional second line"]],
              ["Requirement five", ["Short description, line one", "Optional second line"]],
              ["Requirement six", ["Short description, line one", "Optional second line"]],
            ])}
            ${strip(30, 512 - 143, 1140, 100, "Out of scope (mentioned, not designed)", [
              "Feature A  ·  Feature B  ·  Feature C",
            ])}
          </svg>`,
        script: {
          title: "Functional requirements",
          html: `
            <p>Open by <strong>agreeing on scope</strong>: what users (and any other
            actors) can do with the system, and what we are deliberately leaving out.
            Each card is one capability; the strip lists what's out of scope and why.</p>
            <p><em>(Filler text for the example template. Use up to 9 cards in a 3×3
            grid; the out-of-scope strip sits below the last row.)</em></p>`
        }
      },
      {
        // --- Slide 2: non-functional requirements + estimates ---
        diagram: `
          <svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
            <text class="heading" x="30" y="42">Non-functional requirements</text>
            <text class="subheading" x="372" y="42">how well it has to do it</text>
            ${cardGrid(30, 66, 255, 128, 13, 3, [
              ["Scale", ["Users, data size,", "requests per second"]],
              ["Latency", ["p99 targets for the", "critical paths"]],
              ["Availability", ["Which path must", "never go down"]],
              ["Durability", ["What data can", "never be lost"]],
              ["Consistency", ["Strong where needed,", "eventual elsewhere"]],
              ["Cost", ["The dominant cost", "driver"]],
            ])}
            ${estimatesPanel(832, 66, 338, 270, "Back of the envelope", [
              ["Users", ["100M DAU × 10 requests ≈ 12K QPS"]],
              ["Storage", ["1B rows × 1 KB ≈ 1 TB"]],
              ["Bandwidth", ["12K QPS × 10 KB ≈ 120 MB/s"]],
            ])}
            ${strip(30, 369, 1140, 100, "Takeaway", [
              "The one or two numbers that shape the design, and what they imply.",
            ])}
          </svg>`,
        script: {
          title: "Non-functional requirements and estimates",
          html: `
            <p>Next, the <strong>qualities</strong> the system needs (scale, latency,
            availability, durability, consistency, cost) and a few
            <strong>back-of-the-envelope numbers</strong>. Finish by naming which numbers
            actually drive the design.</p>
            <p><em>(Filler text. The diagram starts on the next slide.)</em></p>`
        }
      },
      {
        // --- Slide 3: the simplest possible starting point ---
        diagram: scene({ add: ["client", "server", "e_client_server"] }),
        script: {
          title: "Start with the simplest thing that works",
          html: `
            <p>Before we add anything, let's establish the <strong>simplest version
            of the system</strong>: a single user talking to a single server over
            HTTP. One client, one process, no scale, no redundancy.</p>
            <p>I always start here because it forces us to agree on the
            <strong>core request/response path</strong> before we complicate it.
            Everything we add later — databases, caches, replicas, queues — exists
            to fix a specific problem this naive version has.</p>
            <p><em>(This is filler text for the example template. Replace it with the
            real opening of the walkthrough for your topic.)</em></p>`
        }
      },
      {
        // --- Slide 4: add ONE new thing (persistence). New items glow. ---
        diagram: scene({ add: ["db", "e_server_db"] }),
        script: {
          title: "Add durable storage",
          html: `
            <p>The server alone keeps everything in memory, so a restart loses all
            state. The first real problem to solve is <strong>durability</strong>, so
            we introduce a <strong>database</strong> behind the server.</p>
            <p>The server now owns business logic and talks to the database for
            reads and writes. We'd choose the store based on the access pattern —
            a relational database for strong consistency and ad-hoc queries, or a
            key-value / document store if we mainly need fast lookups by id.</p>
            <p><em>(Filler text. Each subsequent slide should add exactly one more
            layer — a cache, a load balancer, replicas, a queue — and explain why.)</em></p>`
        }
      },
      {
        // --- Slide 5: replace the single server (remove + add, bus fan-out) ---
        diagram: scene({
          add: ["lb", "app1", "app2", "e_client_lb", "e_app1_db", "e_app2_db"],
          remove: ["server"],
        }),
        script: {
          title: "Scale out behind a load balancer",
          html: `
            <p><em>(Filler text.) This slide shows <strong>remove</strong>: the single
            server is replaced by a load balancer and two stateless app servers. Its
            edges disappear automatically because an endpoint is gone. The load
            balancer fans out along a <strong>bus</strong>.</em></p>`
        }
      },
      {
        // --- Slide 6: a pass-through "tier" box ---
        diagram: scene({ add: ["cache"] }),
        script: {
          title: "Add a cache tier",
          html: `
            <p><em>(Filler text.) A <strong>tier</strong> box is drawn behind the
            edges, so existing app → database lines visibly pass through it.</em></p>`
        }
      },
      {
        // --- Slide 7: async work + a ghost (external) box. Final slide. ---
        diagram: scene({ add: ["queue", "worker", "email", "e_app2_queue", "e_queue_worker", "e_worker_email"] }),
        script: {
          title: "Move slow work off the request path",
          html: `
            <p><em>(Filler text.) Dashed <strong>async</strong> edges show background
            flows, and a dashed <strong>ghost</strong> box shows something that exists
            but isn't designed here (a third party, other regions). The last slide
            should show the complete system.</em></p>`
        }
      }
    ];

    // ========================================================================
    // Engine — shared by every deck. You should not need to edit below here.
    // ========================================================================
    let index = 0;

    const el = {
      topic: document.getElementById("topic"),
      diagram: document.getElementById("diagram"),
      num: document.getElementById("script-num"),
      title: document.getElementById("script-title"),
      body: document.getElementById("script-body"),
      prev: document.getElementById("prev"),
      next: document.getElementById("next"),
      counter: document.getElementById("counter"),
    };

    function render() {
      const slide = SLIDES[index];
      el.topic.textContent = TOPIC;

      // Replace the SVG (keep the #topic badge, which lives before it).
      const existing = el.diagram.querySelector("svg");
      if (existing) existing.remove();
      el.diagram.insertAdjacentHTML("beforeend", slide.diagram);

      el.num.textContent = `Slide ${index + 1} of ${SLIDES.length}`;
      el.title.textContent = slide.script.title;
      el.body.innerHTML = slide.script.html;

      el.counter.textContent = `${index + 1} / ${SLIDES.length}`;
      el.prev.disabled = index === 0;
      el.next.disabled = index === SLIDES.length - 1;

      el.script.scrollTop = 0;
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= SLIDES.length) return;
      index = next;
      render();
    }

    el.prev.addEventListener("click", () => go(-1));
    el.next.addEventListener("click", () => go(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    // #script is referenced in render() for scroll reset.
    el.script = document.getElementById("script");

    render();
  </script>
