<!DOCTYPE html>
<!--
  ============================================================================
  SYSTEM DESIGN WALKTHROUGH — DESIGN TWITTER / X
  ============================================================================

  Built from slides/example.html. Same layout, theme, navigation and engine.

    - Slides 1–2: functional / non-functional requirements (card grids).
    - Slides 3–18: one scene (SCENE) that grows from a single server to the
      full system. The central arc is the home timeline: fan-out on read
      (slide 7) → event bus (8) → fan-out on write (9) → hybrid with a
      celebrity pull path (10).

  Navigation (shared by every deck): on-screen back/forward arrows, plus the
  Left/Right arrow keys.

  The file is fully self-contained — no build step, no external dependencies.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Twitter / X — System Design Walkthrough</title>
  <style>
    :root {
      /* ---- Theme tokens (edit here, not inline) ---- */
      --bg: #0f172a;            /* page background */
      --panel: #1e293b;         /* diagram panel */
      --panel-2: #172033;       /* script panel */
      --ink: #e2e8f0;           /* primary text */
      --ink-dim: #94a3b8;       /* secondary text */
      --accent: #38bdf8;        /* highlights, arrows, titles, "new" glow */
      --border: #334155;        /* panel + box borders */

      /* ---- Diagram element colors (used inside the SVGs) ---- */
      --box-fill: #0b1222;
      --box-stroke: #475569;
      --box-ink: #e2e8f0;
      --line: #64748b;
      --client: #38bdf8;        /* clients / users / external actors */
      --service: #a78bfa;       /* app / services   */
      --data: #34d399;          /* data stores      */
      --infra: #facc15;         /* gateways, load balancers, CDN, DNS */
      --stream: #f472b6;        /* queues, event streaming */
      --ml: #fb923c;            /* ML / batch compute */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Deck fills the viewport; diagram on top (large), script on bottom (smaller). */
    #deck {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 12px;
    }

    /* ---- Top: diagram ---- */
    #diagram {
      flex: 1 1 62%;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    #diagram svg { width: 100%; height: 100%; }

    /* Topic badge, top-left of the diagram panel */
    #topic {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    /* ---- Bottom: script ---- */
    #script {
      flex: 0 0 34%;
      min-height: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      overflow-y: auto;
    }
    #script-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    #script-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--bg);
      background: var(--accent);
      border-radius: 999px;
      padding: 3px 11px;
      white-space: nowrap;
    }
    #script-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }
    #script-body {
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink);
    }
    #script-body p { margin: 0 0 10px; }
    #script-body strong { color: var(--ink); }
    #script-body em { color: var(--ink-dim); font-style: normal; }

    /* ---- Controls ---- */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex: 0 0 auto;
    }
    .nav {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
      font-size: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .nav:hover:not(:disabled) { background: var(--border); border-color: var(--accent); }
    .nav:disabled { opacity: 0.35; cursor: default; }
    #counter {
      font-size: 14px;
      color: var(--ink-dim);
      min-width: 70px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Reusable SVG diagram helpers ---- */
    .box rect {
      fill: var(--box-fill);
      stroke: var(--box-stroke);
      stroke-width: 1.5;
      rx: 10;
    }
    .box.client rect { stroke: var(--client); }
    .box.service rect { stroke: var(--service); }
    .box.data rect { stroke: var(--data); }
    .box.infra rect { stroke: var(--infra); }
    .box.stream rect { stroke: var(--stream); }
    .box.ml rect { stroke: var(--ml); }
    /* A layer that other edges pass through (e.g. a cache tier). Drawn behind edges. */
    .box.tier rect { fill: rgba(52, 211, 153, 0.06); stroke-dasharray: 5 5; }
    /* Something that exists but we are not drawing in detail (other regions, 3rd parties). */
    .box.ghost rect { fill: transparent; stroke-dasharray: 7 6; }
    /* Added on the current slide (set automatically by the scene builder). */
    .box.new rect { stroke-width: 3; filter: drop-shadow(0 0 7px var(--accent)); }
    .box text {
      fill: var(--box-ink);
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .box .sub {
      fill: var(--ink-dim);
      font-size: 11px;
      font-weight: 500;
    }
    .edge {
      stroke: var(--line);
      stroke-width: 1.8;
      fill: none;
      marker-end: url(#arrow);
    }
    .edge.both { marker-start: url(#arrow-start); }      /* two-way */
    .edge.plain { marker-end: none; }                    /* no arrowhead */
    .edge.async { stroke-dasharray: 6 5; }               /* async / background flow */
    .edge.new { stroke: var(--accent); marker-end: url(#arrow-new); }
    .edge.new.both { marker-start: url(#arrow-start-new); }
    .edge.new.plain { marker-end: none; }
    .edge-label {
      fill: var(--ink-dim);
      font-size: 11px;
      text-anchor: middle;
      /* Halo in the panel color keeps labels readable where they cross lines. */
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .edge-label.new { fill: var(--accent); }

    /* ---- Requirement slides (slides 1–2) ---- */
    .heading { fill: var(--accent); font-size: 24px; font-weight: 700; }
    .subheading { fill: var(--ink-dim); font-size: 14px; }
    .card rect { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
    .card .badge { fill: var(--accent); }
    .card .badge-num { fill: var(--bg); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .card .title { fill: var(--box-ink); font-size: 17px; font-weight: 700; }
    .card .line { fill: var(--ink-dim); font-size: 13.5px; }
    .panel-box { fill: var(--box-fill); stroke: var(--accent); stroke-width: 1.5; }
    .panel-title { fill: var(--accent); font-size: 17px; font-weight: 700; }
    .strip { fill: transparent; stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 7 6; }
    .strip-title { fill: var(--ink); font-size: 15px; font-weight: 700; }
    .strip-text { fill: var(--ink-dim); font-size: 13.5px; }
    .est-k { fill: var(--accent); font-size: 13.5px; font-weight: 700; }
    .est-v { fill: var(--ink); font-size: 13.5px; }
  </style>
</head>
<body>
  <div id="deck">
    <section id="diagram" aria-label="System diagram">
      <span id="topic"></span>
      <!-- SVG for the active slide is injected here -->
    </section>

    <section id="script" aria-label="Script">
      <div id="script-header">
        <span id="script-num"></span>
        <span id="script-title"></span>
      </div>
      <div id="script-body"></div>
    </section>

    <div id="controls">
      <button class="nav" id="prev" aria-label="Previous slide">&#8592;</button>
      <span id="counter"></span>
      <button class="nav" id="next" aria-label="Next slide">&#8594;</button>
    </div>
  </div>

  <script>
    // ========================================================================
    // The system being designed.
    // ========================================================================
    const TOPIC = "Design Twitter / X";

    // Shared <defs>: default arrowhead, a start-reversed variant for two-way
    // edges, and accent-colored variants for edges added on the current slide.
    const DEFS = `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
        </marker>
        <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
        <marker id="arrow-start-new" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
      </defs>`;

    // Labeled box. `kind` is a space-separated class list:
    //   color: "client" | "service" | "data" | "infra" | "stream" | "ml"
    //   style: optionally plus "tier" (pass-through layer) or "ghost" (dashed)
    //   "new" is added automatically by the scene builder.
    // `sub` is an optional second line (e.g. a technology or role note).
    function box(x, y, w, h, label, kind = "", sub = "") {
      const cx = x + w / 2;
      const subText = sub
        ? `<text class="sub" x="${cx}" y="${y + h / 2 + 12}">${sub}</text>`
        : "";
      const labelY = sub ? y + h / 2 - 7 : y + h / 2;
      return `
        <g class="box ${kind}">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <text x="${cx}" y="${labelY}">${label}</text>
          ${subText}
        </g>`;
    }

    // ========================================================================
    // Requirement-slide helpers (slides 1–2). Use viewBox 0 0 1200 640.
    // ========================================================================

    // One numbered requirement card: a title plus 1–3 short lines.
    function card(x, y, w, h, num, title, lines) {
      const body = lines
        .map((l, i) => `<text class="line" x="${x + 18}" y="${y + 66 + i * 21}">${l}</text>`)
        .join("");
      return `
        <g class="card">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
          <circle class="badge" cx="${x + 30}" cy="${y + 30}" r="13"></circle>
          <text class="badge-num" x="${x + 30}" y="${y + 30}">${num}</text>
          <text class="title" x="${x + 52}" y="${y + 36}">${title}</text>
          ${body}
        </g>`;
    }

    // A grid of cards, numbered 1..N. items = [[title, [line, line]], ...]
    function cardGrid(x0, y0, w, h, gap, cols, items) {
      return items
        .map((it, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          return card(x0 + c * (w + gap), y0 + r * (h + gap), w, h, i + 1, it[0], it[1]);
        })
        .join("");
    }

    // Dashed strip with a title and lines (out-of-scope list, key takeaway).
    function strip(x, y, w, h, title, lines) {
      const body = lines
        .map((l, i) => `<text class="strip-text" x="${x + 24}" y="${y + 64 + i * 22}">${l}</text>`)
        .join("");
      return `
        <rect class="strip" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
        <text class="strip-title" x="${x + 24}" y="${y + 34}">${title}</text>
        ${body}`;
    }

    // Accent-bordered panel of back-of-the-envelope estimates.
    // rows = [[heading, [value, value]], ...]
    function estimatesPanel(x, y, w, h, title, rows) {
      let cy = y + 66;
      const body = rows
        .map(([k, vs]) => {
          let s = `<text class="est-k" x="${x + 20}" y="${cy}">${k}</text>`;
          vs.forEach((v) => { cy += 21; s += `<text class="est-v" x="${x + 20}" y="${cy}">${v}</text>`; });
          cy += 36;
          return s;
        })
        .join("");
      return `
        <rect class="panel-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
        <text class="panel-title" x="${x + 20}" y="${y + 32}">${title}</text>
        ${body}`;
    }

    // ========================================================================
    // Scene builder — shared by every deck. You should not need to edit this.
    //
    //   const scene = sceneBuilder(SCENE);
    //   scene({ add: ["client", "server", "e_client_server"] })  // -> <svg>
    //   scene({ add: ["db", "e_server_db"] })                    // cumulative
    //   scene({ add: [...], remove: ["server"] })                // replace a box
    //   scene()                                                  // no change
    // ========================================================================

    // Edge label position: midpoint of the longest segment. Above horizontal /
    // diagonal segments, to the right of vertical ones. Override with `lp`.
    function labelPos(e) {
      if (e.lp) return e.lp;
      let best = null, len = -1;
      for (let i = 0; i < e.pts.length - 1; i++) {
        const [x1, y1] = e.pts[i], [x2, y2] = e.pts[i + 1];
        const l = Math.hypot(x2 - x1, y2 - y1);
        if (l > len) { len = l; best = [x1, y1, x2, y2]; }
      }
      const [x1, y1, x2, y2] = best;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      return x1 === x2 ? [mx + 7, my + 4, "start"] : [mx, my - 7, "middle"];
    }

    function sceneBuilder(def) {
      const boxes = Object.fromEntries(def.boxes.map((b) => [b.id, b]));
      const visible = new Set();

      return function step({ add = [], remove = [] } = {}) {
        remove.forEach((id) => visible.delete(id));
        add.forEach((id) => visible.add(id));
        const fresh = new Set(add);
        const isOn = (id) => visible.has(id);

        const lines = [], labels = [], back = [], front = [], pts = [];

        const drawEdge = (pathPts, cls, label, lp) => {
          const d = pathPts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join(" ");
          lines.push(`<path class="edge ${cls}" d="${d}"></path>`);
          pathPts.forEach((p) => pts.push(p));
          if (label) {
            const [lx, ly, anchor] = lp;
            const nw = cls.includes("new") ? "new" : "";
            labels.push(`<text class="edge-label ${nw}" x="${lx}" y="${ly}" style="text-anchor:${anchor}">${label}</text>`);
          }
        };

        // Boxes ("tier" boxes go behind the edges, everything else in front).
        def.boxes.forEach((b) => {
          if (!isOn(b.id)) return;
          const kind = `${b.kind}${fresh.has(b.id) ? " new" : ""}`;
          const svg = box(b.x, b.y, b.w, b.h, b.label, kind, b.sub || "");
          (b.kind.includes("tier") ? back : front).push(svg);
          pts.push([b.x, b.y], [b.x + b.w, b.y + b.h]);
        });

        // Explicit edges: shown when added AND both endpoints are visible.
        def.edges.forEach((e) => {
          if (!isOn(e.id) || !isOn(e.from) || !isOn(e.to)) return;
          const cls = [
            fresh.has(e.id) ? "new" : "",
            e.both ? "both" : "",
            e.async ? "async" : "",
          ].join(" ");
          drawEdge(e.pts, cls, e.label, e.label ? labelPos(e) : null);
        });

        // Optional "bus": a hub (gateway / load balancer) fans out to member
        // boxes via a vertical line. Members join the bus as they are added.
        const bus = def.bus;
        if (bus && isOn(bus.hub)) {
          const members = bus.members.filter(isOn).map((id) => boxes[id]);
          if (members.length) {
            const hubNew = fresh.has(bus.hub);
            const ys = members.map((b) => b.y + b.h / 2).concat([bus.hubY]);
            const top = Math.min(...ys), bottom = Math.max(...ys);
            const pn = hubNew ? "new plain" : "plain";
            drawEdge([[bus.hubX, bus.hubY], [bus.x, bus.hubY]], pn, bus.label, bus.lp);
            drawEdge([[bus.x, top], [bus.x, bottom]], pn);
            members.forEach((b) => {
              const y = b.y + b.h / 2;
              drawEdge([[bus.x, y], [b.x, y]], hubNew || fresh.has(b.id) ? "new" : "");
            });
          }
        }

        // Auto-fit the viewBox to what is visible (with a minimum size).
        const pad = 40;
        let x0 = Math.min(...pts.map((p) => p[0])) - pad;
        let y0 = Math.min(...pts.map((p) => p[1])) - pad;
        let x1 = Math.max(...pts.map((p) => p[0])) + pad;
        let y1 = Math.max(...pts.map((p) => p[1])) + pad;
        const minW = 900, minH = 460;
        if (x1 - x0 < minW) { const g = (minW - (x1 - x0)) / 2; x0 -= g; x1 += g; }
        if (y1 - y0 < minH) { const g = (minH - (y1 - y0)) / 2; y0 -= g; y1 += g; }

        return `
          <svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" xmlns="http://www.w3.org/2000/svg">
            ${DEFS}
            ${back.join("")}
            ${lines.join("")}
            ${front.join("")}
            ${labels.join("")}
          </svg>`;
      };
    }

    // ========================================================================
    // SCENE — every component of the FINAL Twitter/X system.
    //
    // Columns: clients | edge (CDN, gateway) | services | cache tier | data |
    //          async workers | event bus. Row pitch 70px (rows at y = 20, 90,
    //          160, ... 580); each service sits on the same row as the store it
    //          owns, and each async worker on the row of the store it writes.
    // Writes into Kafka route over the top (Tweet Service) and under the
    // bottom (Engagement Service) so they never cross a box.
    // ========================================================================
    const SCENE = {
      boxes: [
        // Clients
        { id: "client",     x: 40,   y: 290, w: 180, h: 90,  label: "Client Apps", kind: "client", sub: "web · iOS · Android" },
        // Edge / infra
        { id: "cdn",        x: 290,  y: 20,  w: 160, h: 54,  label: "CDN", kind: "infra", sub: "edge-cached media" },
        { id: "gateway",    x: 290,  y: 300, w: 160, h: 70,  label: "API Gateway", kind: "infra", sub: "auth · rate limits · routing" },
        // Slide 3–4 only: the naive monolith and its single database
        { id: "server",     x: 530,  y: 300, w: 190, h: 70,  label: "App Server", kind: "service", sub: "one process does it all" },
        { id: "db",         x: 940,  y: 300, w: 180, h: 70,  label: "Database", kind: "data", sub: "users · tweets · follows" },
        // Services
        { id: "tweet",      x: 530,  y: 20,  w: 190, h: 54,  label: "Tweet Service", kind: "service", sub: "post · read · Snowflake IDs" },
        { id: "media",      x: 530,  y: 90,  w: 190, h: 54,  label: "Media Service", kind: "service", sub: "upload · transcode" },
        { id: "graph",      x: 530,  y: 160, w: 190, h: 54,  label: "Graph Service", kind: "service", sub: "follow · unfollow" },
        { id: "notif",      x: 530,  y: 230, w: 190, h: 54,  label: "Notification Svc", kind: "service", sub: "notification inbox" },
        { id: "search",     x: 530,  y: 300, w: 190, h: 54,  label: "Search Service", kind: "service", sub: "query → ranked tweets" },
        { id: "trends",     x: 530,  y: 370, w: 190, h: 54,  label: "Trends Service", kind: "service", sub: "top topics per region" },
        { id: "timeline",   x: 530,  y: 440, w: 190, h: 124, label: "Timeline Service", kind: "service", sub: "home · user timelines" },
        { id: "engage",     x: 530,  y: 580, w: 190, h: 54,  label: "Engagement Svc", kind: "service", sub: "like · retweet · reply" },
        // Cache tier (edges pass through it)
        { id: "cache",      x: 770,  y: 10,  w: 120, h: 272, label: "Cache Tier", kind: "data tier", sub: "hot tweets · users" },
        // Data stores
        { id: "tweetdb",    x: 940,  y: 20,  w: 180, h: 54,  label: "Tweet Store", kind: "data", sub: "sharded by tweet ID" },
        { id: "blob",       x: 940,  y: 90,  w: 180, h: 54,  label: "Media Blob Store", kind: "data", sub: "images · video variants" },
        { id: "graphdb",    x: 940,  y: 160, w: 180, h: 54,  label: "Social Graph", kind: "data", sub: "followers · following" },
        { id: "notifdb",    x: 940,  y: 230, w: 180, h: 54,  label: "Notification Store", kind: "data", sub: "per-user inbox" },
        { id: "searchidx",  x: 940,  y: 300, w: 180, h: 54,  label: "Search Index", kind: "data", sub: "inverted · time-sliced" },
        { id: "trendstore", x: 940,  y: 370, w: 180, h: 54,  label: "Trends Store", kind: "data", sub: "top-K per region" },
        { id: "tlcache",    x: 940,  y: 440, w: 180, h: 54,  label: "Timeline Cache", kind: "data", sub: "Redis · ~800 IDs / user" },
        { id: "ranker",     x: 940,  y: 510, w: 180, h: 54,  label: "Ranking Service", kind: "ml", sub: "For You · ML scoring" },
        { id: "counters",   x: 940,  y: 580, w: 180, h: 54,  label: "Counter Store", kind: "data", sub: "likes · RTs · replies" },
        // Async workers
        { id: "regions",    x: 1200, y: 20,  w: 190, h: 54,  label: "Other Regions ×N", kind: "ghost", sub: "same stack · replicated" },
        { id: "push",       x: 1200, y: 150, w: 190, h: 54,  label: "APNs / FCM", kind: "ghost", sub: "push to devices" },
        { id: "notifw",     x: 1200, y: 230, w: 190, h: 54,  label: "Notification Workers", kind: "service", sub: "who to notify, dedupe" },

            herd when a famous tweet goes viral. Hot keys get replicated across several cache
            nodes, so no single node takes all the traffic.</p>
            <p>The threshold is a tunable trade-off: lower means less fan-out work but more
            merging at read time. The trick is the same as before: <strong>do expensive work
            where it's cheapest</strong>. For normal users that's at write time; for celebrities
            it's at read time.</p>`
        }
      },
      {
        // --- Slide 11: media ---
        diagram: scene({ add: ["media", "blob", "cdn", "e_media_blob", "e_cdn_client", "e_cdn_blob"] }),
        script: {
          title: "Media: blob storage and a CDN",
          html: `
            <p>Tweets are small, but media isn't: roughly <strong>50 TB a day</strong>. Those
            bytes should never flow through the tweet path. The <strong>Media Service</strong>
            handles uploads separately. The client asks it for an upload slot, uploads the file
            directly to the <strong>blob store</strong> (S3 or similar) with a signed URL, in
            resumable chunks for video, and gets back a <strong>media ID</strong>. The tweet
            itself only carries that ID.</p>
            <p>After upload the Media Service kicks off processing. Images get resized into a
            few variants and stripped of metadata such as GPS. Video gets transcoded into an
            adaptive-bitrate ladder so phones on bad connections still play smoothly. A tweet
            whose media is still processing can show a placeholder.</p>
            <p>Delivery goes through a <strong>CDN</strong>. Media is immutable once processed,
            so it caches forever under a content-addressed URL. A viral image gets served from
            edge nodes near users, and the CDN pulls from the blob store only on a cache miss.
            At this volume, the CDN hit ratio is basically the media bill.</p>
            <p>Blob storage is cheap and durable, eleven nines with cross-region replication.
            Older, rarely viewed media can move to colder storage tiers automatically.</p>`
        }
      },
      {
        // --- Slide 12: engagement + counters ---
        diagram: scene({ add: ["engage", "counters", "e_engage_counters", "e_engage_kafka"] }),
        script: {
          title: "Engagement: likes, retweets, replies and counters",
          html: `
            <p>The <strong>Engagement Service</strong> handles likes, retweets and replies. Each
            one is two things: a <strong>relationship</strong> (user U liked tweet T, needed
            for "you liked this" and for preventing double-likes) and a
            <strong>counter</strong> shown on the tweet.</p>
            <p>Counters are where naive designs fall over. A viral tweet can take tens of
            thousands of likes a second, and a single row being incremented is a lock-contention
            hotspot. So the <strong>Counter Store</strong> uses <strong>sharded
            counters</strong>: each tweet's count is split across N sub-counters, increments go
            to a random one, and reads sum them, usually from cache. We can also batch
            increments in memory for a second before flushing. Being off by a few likes for a
            moment is fine; we said counts are eventually consistent.</p>
            <p>A <strong>retweet</strong> is stored as a tiny tweet that points at the original,
            so it flows through the same TweetCreated and fan-out machinery. A
            <strong>reply</strong> is a tweet with a reply-to pointer, which also gives us
            conversation threads. Follows from the Graph Service publish events onto the same
            bus.</p>
            <p>Every engagement is also published to the bus as an event. Those events turn out
            to be some of the most valuable data in the system: they drive notifications, and
            they're the main training signal for ranking.</p>`
        }
      },
      {
        // --- Slide 13: search ---
        diagram: scene({ add: ["search", "searchidx", "indexer", "e_search_idx", "e_kafka_indexer", "e_indexer_idx"] }),
        script: {
          title: "Real-time search",
          html: `
            <p>Search on Twitter is unusual because <strong>recency dominates</strong>. People
            search for what's happening right now, and a tweet from ten seconds ago is often
            the best result. So the index has to be updated in near real time, not rebuilt
            nightly.</p>
            <p>A <strong>Search Indexer</strong> consumes TweetCreated from the bus, tokenizes
            the text, extracts hashtags, mentions and language, and appends to an
            <strong>inverted index</strong>: for each term, the list of tweet IDs containing it.
            Since tweet IDs are time-ordered, posting lists are naturally sorted
            newest-first.</p>
            <p>The index is <strong>partitioned by time</strong>. The newest slice, the last few
            hours, is small, held fully in memory, and takes all the writes. Older slices are
            immutable and optimized for reads. Twitter's Earlybird worked like this; with
            Elasticsearch you'd use time-based indices. Each time slice is also sharded by
            tweet ID so a query can run across shards in parallel.</p>
            <p>The <strong>Search Service</strong> runs the query against the recent slices
            first and goes further back only if it needs more results. It then ranks by a mix
            of recency, engagement and the searcher's social graph, and hydrates the winners
            just like the timeline does. A new tweet is typically searchable within a few
            seconds of posting.</p>`
        }
      },
      {
        // --- Slide 14: trends ---
        diagram: scene({ add: ["trends", "trendstore", "trendproc", "e_trends_store", "e_kafka_trend", "e_trend_store"] }),
        script: {
          title: "Trending topics",
          html: `
            <p>Trends are a <strong>stream-processing</strong> problem. <strong>Trend
            Detection</strong> consumes the tweet stream, extracts hashtags and key phrases, and
            keeps <strong>sliding-window counts</strong> per term per region, for example over the
            last 5 minutes, the last hour, and a longer baseline.</p>
            <p>The key insight is that a trend isn't the <em>most frequent</em> term; that
            would just be "good morning" forever. A trend is a term whose current rate is
            <strong>far above its baseline</strong>. So the score compares the short window to
            the long window, a measure of velocity or acceleration. We can't keep exact counts
            for every possible phrase in every region, so we use approximate structures:
            count-min sketches for frequencies and a heap for the top candidates.</p>
            <p>The output is small: a <strong>top-K list per region</strong>, refreshed every
            minute or so and written to the <strong>Trends Store</strong>. The <strong>Trends
            Service</strong> just reads that list, so serving it is a trivially cacheable key
            lookup, even though computing it is the heavy part.</p>
            <p>In a real deployment there's also a filtering layer for spam and coordinated
            manipulation before anything is shown. That belongs to trust and safety, which we
            scoped out, but I'd call it out as a hook.</p>`
        }
      },
      {
        // --- Slide 15: notifications ---
        diagram: scene({ add: ["notif", "notifdb", "notifw", "push", "e_notif_notifdb", "e_kafka_notifw", "e_notifw_notifdb", "e_notifw_push"] }),
        script: {
          title: "Notifications",
          html: `
            <p><strong>Notification Workers</strong> consume from the same bus: likes,
            retweets, replies, follows, and mentions parsed out of new tweets. For each event
            they work out <strong>who should be told</strong> and whether they want to be, based
            on their settings, muted words, blocks, and whether the actor is someone they
            follow.</p>
            <p>The big problem here is <strong>noise</strong>. A celebrity's tweet can get
            50,000 likes in a minute, and nobody wants 50,000 notifications. So the workers
            <strong>aggregate</strong>: "A, B and 4,998 others liked your tweet" is one
            notification, updated in place, and pushes are rate-limited per user. Events can be
            redelivered, so writes are keyed by event ID to make them
            <strong>idempotent</strong>.</p>
            <p>There are two outputs. The <strong>Notification Store</strong> is a per-user
            inbox, newest first, read by the <strong>Notification Service</strong> when you
            open the tab. Mobile push goes through Apple's and Google's push services, APNs
            and FCM, drawn dashed because they're third parties we don't design.</p>
            <p>Because this all runs off the bus, a slow push provider or a burst of activity
            delays notifications by a few seconds but never affects posting or timeline
            reads.</p>`
        }
      },
      {
        // --- Slide 16: For You ranking ---
        diagram: scene({ add: ["ranker", "mlpipe", "e_tl_ranker", "e_kafka_ml", "e_ml_ranker"] }),
        script: {
          title: "The For You timeline: candidates and ranking",
          html: `
            <p>Everything so far serves the chronological "Following" timeline. <strong>For
            You</strong> is a ranking problem, and it's built as a classic two-stage
            pipeline.</p>
            <p><strong>Candidate generation</strong> gathers maybe a thousand or so tweets that
            might interest you. Roughly half come from <em>in-network</em> sources: the timeline
            cache and celebrity pull we already built. The rest are <em>out-of-network</em>:
            tweets popular among people similar to you, or liked by accounts you engage with,
            found through embeddings and graph walks computed offline.</p>
            <p>The Timeline Service sends those candidates to the <strong>Ranking
            Service</strong>, which scores each one with a model that predicts the probability
            of engagement: like, reply, retweet, dwell, or "not interested". It then applies
            rules on top for author diversity, freshness, and filtering out blocked or muted
            content. The model needs features at scoring time, such as your recent engagement
            and the tweet's early engagement velocity, read from a low-latency feature
            store.</p>
            <p>The <strong>ML Pipeline</strong> closes the loop. It consumes engagement events
            from the bus to update features in near real time, and periodically retrains the
            model on what people actually engaged with. That's why those events were worth
            publishing.</p>
            <p>The important design property is <strong>graceful degradation</strong>. Ranking
            is the most complex, most failure-prone part of the read path, so it runs with a
            tight timeout. If it's slow or down, the Timeline Service falls back to the
            chronological in-network timeline, and the user still gets a feed.</p>`
        }
      },
      {
        // --- Slide 17: multi-region ---
        diagram: scene({ add: ["regions", "e_regions"] }),
        script: {
          title: "Going global: regions, replication and failure",
          html: `
            <p>Users are everywhere, so the whole stack is deployed in <strong>several
            regions</strong>, and users are routed to a nearby one. Within a region everything
            we've drawn is replicated across availability zones.</p>
            <p>Between regions, the <strong>source-of-truth stores</strong> (tweets, the
            graph, engagement) replicate <strong>asynchronously</strong>. That fits our
            consistency model: it's fine if a tweet posted in Europe takes a second longer to
            appear in Asia. Writes for a given user are homed in one region at a time to avoid
            conflicts. Since tweets are immutable and IDs come from Snowflake with a region
            bit, there's almost nothing to conflict on anyway.</p>
            <p>The <strong>derived data</strong> (timeline caches, search indexes, trends,
            counters) doesn't need cross-region replication. Each region rebuilds its own copy
            from the replicated event stream. That's one more payoff of putting the event log
            at the center: derived state is <strong>rebuildable</strong>.</p>
            <p>Failure handling follows the priorities from slide 2. If a region goes down,
            users are rerouted and their timelines rebuild on demand from the pull path. If
            ranking fails, we show chronological. If search, trends or notifications lag, they
            catch up from Kafka. Posting and reading the Following timeline are protected
            above everything else.</p>`
        }
      },
      {
        // --- Slide 18: the complete system ---
        diagram: scene(),
        script: {
          title: "The complete system: one tweet, end to end",
          html: `
            <p>To wrap up, let's follow <strong>one tweet</strong> through the whole picture.</p>
            <p>A user attaches a photo. The client uploads it directly to the
            <strong>blob store</strong> through the Media Service and gets a media ID. It then
            posts the tweet through the <strong>API gateway</strong> to the <strong>Tweet
            Service</strong>, which assigns a Snowflake ID, writes it durably to the
            <strong>tweet store</strong>, and publishes <strong>TweetCreated</strong>. The user
            gets a success response in tens of milliseconds and sees their tweet
            immediately.</p>
            <p>Everything else happens asynchronously off the event bus. <strong>Fan-out
            workers</strong> push the ID into the timeline caches of the author's active
            followers, unless the author is a celebrity. The <strong>indexer</strong> makes it
            searchable within seconds. <strong>Trend detection</strong> counts its hashtags.
            <strong>Notification workers</strong> alert anyone it mentions.</p>
            <p>A follower opens the app. The <strong>Timeline Service</strong> reads their ID
            list from the timeline cache, pulls recent tweets from any celebrities they follow
            out of the <strong>cache tier</strong>, has the <strong>ranker</strong> order the
            candidates for For You, hydrates the winners, and returns them in well under 200
            milliseconds. The photo loads from a <strong>CDN</strong> edge nearby. When they
            like it, the <strong>Engagement Service</strong> bumps a sharded counter and
            publishes an event, which turns into a notification for the author and a training
            signal for tomorrow's ranking model.</p>
            <p>The big ideas: <strong>separate the write path from the read path</strong> and
            connect them with an event log. <strong>Precompute timelines</strong> because reads
            dominate, but <strong>switch to pull for celebrities</strong>, where push breaks
            down. Keep the bytes in blob storage and on the CDN. Make all derived data
            rebuildable, and degrade gracefully so the timeline always loads. Next, I'd go
            deeper on whatever the interviewer cares about most: the fan-out pipeline, ranking,
            or search.</p>`
        }
      }
    ];

    // ========================================================================
    // Engine — shared by every deck. You should not need to edit below here.
    // ========================================================================
    let index = 0;

    const el = {
      topic: document.getElementById("topic"),
      diagram: document.getElementById("diagram"),
      num: document.getElementById("script-num"),
      title: document.getElementById("script-title"),
      body: document.getElementById("script-body"),
      prev: document.getElementById("prev"),
      next: document.getElementById("next"),
      counter: document.getElementById("counter"),
    };

    function render() {
      const slide = SLIDES[index];
      el.topic.textContent = TOPIC;

      // Replace the SVG (keep the #topic badge, which lives before it).
      const existing = el.diagram.querySelector("svg");
      if (existing) existing.remove();
      el.diagram.insertAdjacentHTML("beforeend", slide.diagram);

      el.num.textContent = `Slide ${index + 1} of ${SLIDES.length}`;
      el.title.textContent = slide.script.title;
      el.body.innerHTML = slide.script.html;

      el.counter.textContent = `${index + 1} / ${SLIDES.length}`;
      el.prev.disabled = index === 0;
      el.next.disabled = index === SLIDES.length - 1;

      el.script.scrollTop = 0;
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= SLIDES.length) return;
      index = next;
      render();
    }

    el.prev.addEventListener("click", () => go(-1));
    el.next.addEventListener("click", () => go(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    // #script is referenced in render() for scroll reset.
    el.script = document.getElementById("script");

    render();
  </script>
</body>
